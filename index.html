    const e = Z.eimer[UI.eimer], w = UI.ende || 'geerntet';
    const anz = Z.log.filter(x => x.eimer === UI.eimer && imAnbau(x, UI.eimer)).length;
    return kopf(e.name) + `
      <h2 style="margin-top:4px">Anbau beenden</h2>
      <p class="leise" style="font-size:16px">Der Tank wird frei für die nächste Pflanze: Phase zurück auf Anzucht, Kalender leer. ${anz ? `Die ${anz} ${anz === 1 ? 'Eintrag bleibt' : 'Einträge bleiben'} unter „Frühere Anbauten“ lesbar.` : ''}</p>
      <div class="gruppe"><div class="gruppe-titel">Wie ist er ausgegangen?</div>
        ${segment('ende', [['geerntet', 'Geerntet'], ['fehl', 'Hat nicht geklappt']], w).replace(/data-act="setz"/g, 'data-act="endeArt"')}</div>
      ${w === 'geerntet'
        ? `<label class="feld"><span>Ertrag in Gramm (freiwillig)</span><input type="text" inputmode="decimal" id="ertrag" placeholder="z. B. 350" value="${esc(UI.eingabe.ertrag || '')}"></label>`
        : ''}
      <label class="feld"><span>${w === 'geerntet' ? 'Notiz (freiwillig)' : 'Was ist passiert? (freiwillig)'}</span><input type="text" id="endeNotiz" style="font-size:18px" placeholder="${w === 'geerntet' ? 'z. B. schöne dichte Blüten' : 'z. B. Wurzelfäule in Woche 3'}" value="${esc(UI.eingabe.endeNotiz || '')}"></label>
      ${fehlerText()}
      <button class="zeile-knopf" data-act="anbauBeenden" style="background:var(--akzent);color:var(--akzent-text)">Anbau beenden</button>

      <h2>Tank entfernen</h2>
      <p class="leise" style="font-size:16px">Nur wenn du wirklich einen Tank weniger hast. Er verschwindet aus der Übersicht, sein Tagebuch bleibt erhalten. Zurückholen kannst du ihn unter Einstellungen → Tanks.</p>
      <button class="zeile-knopf leise-knopf" data-act="tankEntfernen">Tank entfernen</button>`;
  }
  function anbauTitel(a) {
    const bis = new Date(a.ende).toLocaleDateString('de-DE', { day: 'numeric', month: 'numeric', year: 'numeric' });
    const von = a.start ? new Date(a.start).toLocaleDateString('de-DE', { day: 'numeric', month: 'numeric' }) + ' bis ' : 'bis ';
    return von + bis;
  }
  function vArchiv() {
    const e = Z.eimer[UI.eimer], liste = (e.anbauten || []).map((a, k) => [a, k]).reverse();
    return kopf('Frühere Anbauten') + `<p class="leise" style="font-size:16px">${esc(e.name)}. Tippe einen Anbau an, um alle seine Einträge zu sehen.</p>` +
      (liste.length ? `<div class="liste">${liste.map(([a, k]) => {
        const n = Z.log.filter(x => inArchiv(x, UI.eimer, k)).length;
        const erg = a.ergebnis === 'fehl' ? 'Hat nicht geklappt' : 'Geerntet' + (a.ertrag ? ', ' + fmt(a.ertrag, 0) + ' g' : '');
        return `<button class="listen-zeile" data-act="archivAnbau" data-k="${k}"><span><b class="zahl">${esc(anbauTitel(a))}</b><small>${esc(erg)} · ${n} ${n === 1 ? 'Eintrag' : 'Einträge'}${a.notiz ? ' · ' + esc(a.notiz) : ''}</small></span><span class="pfeil" aria-hidden="true">›</span></button>`;
      }).join('')}</div>` : '<div class="leer">Noch kein Anbau beendet.</div>');
  }
  function vArchivAnbau() {
    const e = Z.eimer[UI.eimer], k = UI.archivK, a = e.anbauten[k];
    const liste = Z.log.filter(x => inArchiv(x, UI.eimer, k)).slice().reverse();
    const fotos = FOTOS.filter(f => inArchiv(f, UI.eimer, k));
    const erg = a.ergebnis === 'fehl' ? 'Hat nicht geklappt' : 'Geerntet' + (a.ertrag ? ', ' + fmt(a.ertrag, 0) + ' g' : '');
    return kopf(anbauTitel(a)) + `<p class="leise zahl" style="font-size:16px">${esc(e.name)} · ${esc(erg)}${a.notiz ? '<br>' + esc(a.notiz) : ''}</p>
      ${fotos.length ? `<div class="fotos">${fotos.map(f => `<button data-act="fotoZeigen" data-id="${esc(f.id)}"><img src="${fotoUrl(f)}" alt="Foto vom ${esc(datum(f.datum))}"></button>`).join('')}</div>` : ''}
      ${liste.length ? liste.map(eintragHtml).join('') : '<div class="leer">Keine Einträge in diesem Anbau.</div>'}`;
  }
  function vRunde() {
    const R = UI.runde; if (!R) return vStart();
    const n = R.liste.length;
    if (R.k >= n) {
      return kopf('Messrunde fertig') + `<p class="leise" style="font-size:16px">Das hat sich seit dem letzten Mal getan:</p>` +
        R.liste.map(i => { const e = Z.eimer[i], lg = lage(i), l = letzter(i);
          return `<div class="eimer" style="cursor:default"><div class="eimer-oben"><div class="eimer-name">${esc(e.name)}</div>${l ? `<div class="ec-gross zahl${ecKlasse(l.ec, zielEC(e))}" style="font-size:28px">${fmt(l.ec, 2)}<small>EC, Soll ${fmt(zielEC(e), 2)}</small></div>` : ''}</div>
            ${R.ids[i] ? lageHtml(lg) : '<p class="empf ruhig">Übersprungen.</p>'}
            ${R.ids[i] && lg && lg.knopf ? `<button class="zeile-knopf" data-act="${lg.knopf[0]}" data-i="${i}" style="margin:12px 0 0;background:var(--akzent);color:var(--akzent-text)">${lg.knopf[1]}</button>` : ''}</div>`; }).join('')
        + `<button class="zeile-knopf leise-knopf" data-act="tab" data-v="start">Zur Übersicht</button>`;
    }
    const i = R.liste[R.k], e = Z.eimer[i], x = R.ids[i] ? Z.log.find(y => y.id === R.ids[i]) : null;
    return kopf('Messrunde') + `<div class="runde-punkte" aria-hidden="true">${R.liste.map((_, k) => `<span class="${k <= R.k ? 'an' : ''}"></span>`).join('')}</div>
      <p class="leise" style="font-size:15px;margin:0">Tank ${R.k + 1} von ${n}</p>
      <h2 style="margin:2px 0 2px">${esc(e.name)}</h2><p class="leise" style="font-size:15px;margin-top:0">${esc(reglerText(e))}</p>
      ${eintragFelder('mess', x).replace(/<label class="feld"><span>Notiz \(freiwillig\)<\/span>.*?<\/label>/s, '')}
      ${fehlerText()}
      <p class="leise" style="font-size:15px">Was du einträgst, ist sofort gespeichert. Mit dem Pfeil oben kannst du jederzeit aufhören.</p>
      <p class="leise" style="font-size:15px">EC ${frage('ec')} &nbsp; pH ${frage('ph')}</p>
      <div class="knoepfe"><div class="knoepfe-innen">
        ${R.k > 0 ? '<button class="gross ruhig" data-act="rundeZurueck" style="flex:0 0 auto;padding:0 16px">Zurück</button>' : ''}
        <button class="gross ruhig" data-act="rundeWeiter" data-skip="1" style="flex:0 0 auto;padding:0 16px">Überspringen</button>
        <button class="gross haupt" data-act="rundeWeiter">${R.k === n - 1 ? 'Fertig' : 'Weiter'}</button></div></div>`;
  }
  // Kurze Erklärungen hinter jedem „?“ (Stufe 3 des Leitsatzes)
  const ERKL = {
    ec: ['Was ist EC?', 'EC zeigt, wie viel Dünger im Wasser gelöst ist. Steigt sie, hat die Pflanze mehr Wasser getrunken als Nährstoffe genommen. Sinkt sie, hat sie Hunger.'],
    ph: ['Was ist pH?', 'pH zeigt, ob das Wasser eher sauer oder basisch ist. Zwischen etwa 5,6 und 6,2 kann die Pflanze die Nährstoffe am besten aufnehmen. Liegt er daneben, kommt sie an manche nicht mehr dran, obwohl sie im Wasser sind.'],
    ziel: ['Was ist die Ziel-EC?', 'So stark soll die Lösung im Tank sein, passend zu Phase, Sorte und Stärke. Das Leitungswasser ist schon mit eingerechnet. Liegt deine Messung mehr als 0,3 darüber oder darunter, färbt die App die Zahl ein.'],
    nachfuellen: ['Wasser oder Nährlösung?', 'Die App rechnet aus, wo die EC landet, wenn du nur Wasser nachfüllst. Bleibt sie dann am Ziel, reicht Wasser. Fällt sie darunter, kommt Nährlösung nach. Deshalb vorher immer frisch messen.'],
    seit: ['Seit dem letzten Mal', 'Der Unterschied zwischen deiner letzten Messung und dem Stand davor. Minus-Liter heißt: So viel hat die Pflanze getrunken. Steigt die EC, hat sie mehr Wasser als Nährstoffe genommen.'],
    kurve: ['Die EC-Kurve', 'Jeder Punkt ist eine Messung in diesem Anbau. Das helle Band ist dein Zielbereich. Läuft die Linie darüber, eher Wasser nachfüllen. Läuft sie darunter, eher Nährlösung.'],
    dazu: ['Was kommt dazu?', 'So viel Stickstoff, Phosphor, Kalium, Calcium und Magnesium bringen Dünger und Säure beim Nachfüllen in den ganzen Tank, gerechnet auf die volle Füllhöhe. Was die Pflanze schon verbraucht hat, weiß die App nicht. Wie viel insgesamt drin ist, zeigt dir die EC.'],
    anbau: ['Anbau beenden', 'Nach der Ernte oder wenn etwas schiefgegangen ist. Der Tank wird frei für die nächste Pflanze, die alten Einträge bleiben unter „Frühere Anbauten“ lesbar.'],
  };
  const frage = k => `<button class="frage-knopf" data-act="erklaer" data-k="${k}" aria-label="${esc(ERKL[k][0])}">?</button>`;
  function blattHtml() {
    const k = UI.erkl; if (!k || !ERKL[k]) return '';
    return `<div class="blatt-hg" data-act="erklaerZu"><div class="blatt" role="dialog" aria-modal="true" aria-labelledby="blattTitel"><h2 id="blattTitel">${esc(ERKL[k][0])}</h2><p>${esc(ERKL[k][1])}</p>
      <button class="zeile-knopf" data-act="erklaerZu" style="margin:0;background:var(--akzent);color:var(--akzent-text)">Verstanden</button></div></div>`;
  }

  // Nachschlagewerk: Gruppen und das „Warum“ zu jedem Problem
  const GRUPPEN_DOK = [
    ['Etwas fehlt', ['n_mangel', 'p_mangel', 'k_mangel', 'mg_mangel', 'ca_mangel', 'fe_mangel', 'spuren']],
    ['Zu viel', ['n_zuviel', 'brand']],
    ['pH, Licht und Wärme', ['ph', 'hitze']],
    ['Wurzeln', ['wurzel', 'sauerstoff']],
    ['Schädlinge', ['spinnmilben', 'thripse', 'blattlaeuse', 'weisse_fliege', 'trauermuecken']],
    ['Schimmel', ['mehltau', 'botrytis']],
  ];
  const WARUM = {
    n_mangel: 'Zu wenig Dünger in der Lösung, oder die Pflanze wächst schneller, als nachgefüttert wird. Dann holt sie sich den Stickstoff aus den alten Blättern.',
    n_zuviel: 'Die Lösung ist zu stark, vor allem mit viel Stickstoff. Das passiert leicht im Wachstum oder wenn die Stärke zu hoch steht.',
    brand: 'Zu viel Salz in der Lösung. Trinkt die Pflanze viel Wasser, steigt die EC im Tank immer weiter, wenn nur Nährlösung nachkommt.',
    p_mangel: 'Zu wenig Phosphor in der Lösung, oder es ist an den Wurzeln zu kalt. Dann nimmt die Pflanze ihn schlecht auf.',
    k_mangel: 'Zu wenig Kalium in der Lösung. In der Blüte steigt der Bedarf stark, dann fällt ein Mangel zuerst auf.',
    mg_mangel: 'Zu wenig Magnesium, oder zu viel Kalium und Calcium, die es verdrängen. Weiches Wasser bringt selbst kaum Magnesium mit.',
    ca_mangel: 'Zu wenig Calcium, ein falscher pH oder sehr feuchte Luft. Calcium wandert nur mit dem Wasserstrom in die Blätter, und bei hoher Luftfeuchte verdunstet die Pflanze zu wenig.',
    fe_mangel: 'Meist ein zu hoher pH. Das Eisen ist dann in der Lösung, aber die Pflanze kommt nicht dran.',
    spuren: 'Meist ein zu hoher pH, seltener fehlen die Spurenelemente im Dünger.',
    ph: 'Liegt der pH zu hoch oder zu tief, sperrt die Pflanze einzelne Nährstoffe aus, obwohl genug davon im Tank ist.',
    hitze: 'Die Lampe hängt zu tief oder es ist an der Pflanzenspitze zu warm.',
    wurzel: 'Warmes Wasser mit wenig Sauerstoff. Über etwa 22 °C vermehren sich Fäulniskeime schnell, Licht im Tank und abgestorbene Wurzelreste helfen ihnen dabei.',
    sauerstoff: 'Die Luftpumpe schafft zu wenig, der Sprudelstein ist verstopft oder das Wasser ist zu warm. Warmes Wasser hält weniger Sauerstoff.',
    spinnmilben: 'Warme, trockene Luft. Sie werden über Kleidung, neue Pflanzen oder von draußen eingeschleppt.',
    thripse: 'Sie kommen mit neuen Pflanzen, Erde oder durch offene Fenster herein.',
    blattlaeuse: 'Eingeschleppt über neue Pflanzen oder Kleidung, oft nach einem Besuch im Garten.',
    weisse_fliege: 'Eingeschleppt. Sie mögen es warm und vermehren sich sehr schnell.',
    trauermuecken: 'Dauerhaft feuchte Oberflächen, etwa nasser Blähton oder Anzuchtwürfel im Netztopf.',
    mehltau: 'Schwankende Luftfeuchte, wenig Luftbewegung und dicht stehende Blätter.',
    botrytis: 'Feuchte Luft in der späten Blüte, besonders nachts, und dichte Blüten, die schlecht abtrocknen.',
  };
  function vProblem() {
    const u = Dk.URSACHEN.find(x => x.id === UI.problem); if (!u) return vDoktor();
    return kopf(u.titel) + `
      <div class="problem-teil"><h3>Woran du es erkennst</h3><p>${esc(u.erkennen)}</p></div>
      ${WARUM[u.id] ? `<div class="problem-teil"><h3>Warum es passiert</h3><p>${esc(WARUM[u.id])}</p></div>` : ''}
      <div class="problem-teil"><h3>Was du tun kannst</h3><ul>${u.tun.map(t => `<li>${esc(t)}</li>`).join('')}</ul>${u.reife ? `<p style="margin-top:8px"><b>${esc(u.reife)}</b></p>` : ''}</div>
      <p class="leise" style="font-size:15px">Ändere immer nur eine Sache auf einmal und beobachte zwei bis drei Tage.</p>
      <button class="zeile-knopf" data-act="problemNotieren" style="background:var(--akzent);color:var(--akzent-text)">Als Eintrag speichern</button>
      ${UI.problemWahl ? `<div class="gruppe"><div class="gruppe-titel">Bei welchem Tank?</div>${Z.eimer.map((e, i) => e.aktiv === false ? '' : `<button class="zeile-knopf doktor" data-act="problemTank" data-i="${i}">${esc(e.name)}</button>`).join('')}</div>` : ''}`;
  }

  function vHilfeStart() {
    return `<img class="logo-klein" src="${LOGO}" alt="Hydro-Assistent" width="96" height="64"><h1>Hilfe</h1>
      <button class="tuer haupt" data-act="doktorHilfe"><b>Meine Pflanze sieht komisch aus</b><span>Pflanzendoktor: antippen, was du siehst, und mögliche Ursachen sehen</span></button>
      <button class="tuer" data-act="hilfe"><b>Wie funktioniert das?</b><span>Anleitung zur App, Schritt für Schritt</span></button>
      <h2>Kurz erklärt</h2>
      <div class="liste">${Object.keys(ERKL).map(k => `<button class="listen-zeile" data-act="erklaer" data-k="${k}" style="min-height:56px"><span><b style="font-size:17px">${esc(ERKL[k][0])}</b></span><span class="pfeil" aria-hidden="true">›</span></button>`).join('')}</div>` + nav();
  }
  function vDoktor() {
    const e = Z.eimer[UI.eimer], d = UI.dok, k = kontext();
    const symListe = Dk.SYMPTOME.filter(s => s[2].includes(d.wo));
    const versucht = d.versucht || [];
    let erg = '';
    if (d.ergebnis) {
      const r = d.ergebnis;
      const frageHtml = r.frage ? `<div class="frage"><b>${esc(r.frage.frage)}</b>${r.frage.antworten.map((a, i) => `<button data-act="dokAntwort" data-f="${r.frage.id}" data-i="${i}">${esc(a)}</button>`).join('')}
        <p class="leise" style="font-size:15px;margin:4px 0 0">Eine Antwort macht die Einschätzung genauer. Du kannst die Frage auch überspringen.</p></div>` : '';
      erg = `<h2 id="ergebnis">Einschätzung</h2>` + (versucht.length ? `<div class="hinweise"><p>Die letzte Maßnahme hat nicht geholfen. Schau dir auch die weiteren Ursachen an, die bereits versuchte ist markiert.</p></div>` : '') + hinweisBox(r.warnungen) + frageHtml +
        (r.ursachen.length ? r.ursachen.slice().sort((a, b) => versucht.includes(a.id) - versucht.includes(b.id)).map(u => `<div class="befund">
          <h3>${esc(u.titel)}${versucht.includes(u.id) ? ' <span class="versucht">(bereits versucht)</span>' : ''}</h3><div class="stufe ${u.stufe === 'möglich' ? 'moeglich' : ''}">${u.stufe === 'möglich' ? 'Möglich' : 'Wahrscheinlich'}</div>
          <p>${esc(u.erkennen)}</p>
          ${u.gruende.length ? `<div class="passt">${u.gruende.map(esc).join('<br>')}</div>` : ''}
          ${u.hinweis ? `<p><b>${esc(u.hinweis)}</b></p>` : ''}
          <ul>${u.tun.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>`).join('')
          : '<div class="leer">Dazu passt keine der hinterlegten Ursachen gut. Miss pH und EC, und schau dir die Wurzeln an. Wenn es schlimmer wird, mach ein Foto und frag nach.</div>') +
        `<p class="leise" style="font-size:15px">Das ist eine Einschätzung, keine sichere Diagnose. Ändere immer nur eine Sache und beobachte 2 bis 3 Tage.</p>
        <button class="zeile-knopf" data-act="dokNotieren">Im Tagebuch notieren</button>`;
    }
    const aktive = Z.eimer.map((x, i) => [i, x]).filter(([, x]) => x.aktiv !== false);
    const wahl = UI.dokVon === 'hilfeStart' && aktive.length > 1
      ? `<div class="gruppe"><div class="gruppe-titel">Welcher Tank?</div>${segment('dokTank', aktive.map(([i, x]) => [String(i), x.name]), String(UI.eimer)).replace(/data-act="setz" data-feld="dokTank" data-wert="(\d+)"/g, 'data-act="dokTank" data-i="$1"')}</div>` : '';
    const modus = UI.dokModus || 'sym';
    const wege = `<div class="gruppe">${segment('dokModus', [['sym', 'Symptome auswählen'], ['alle', 'Alle Probleme']], modus).replace(/data-act="setz"/g, 'data-act="dokModus"')}</div>`;
    if (modus === 'alle') return kopf('Pflanzendoktor') + wege + `<p class="leise" style="font-size:16px">Zum Nachschlagen. Tippe ein Problem an.</p>` +
      GRUPPEN_DOK.map(([g, ids]) => `<h2>${esc(g)}</h2><div class="liste">${ids.map(id => Dk.URSACHEN.find(x => x.id === id)).filter(Boolean).map(u =>
        `<button class="listen-zeile" data-act="problem" data-id="${u.id}" style="min-height:56px"><span><b style="font-size:17px">${esc(u.titel)}</b></span><span class="pfeil" aria-hidden="true">›</span></button>`).join('')}</div>`).join('');
    return kopf('Pflanzendoktor') + wege + wahl + `
      <p class="leise zahl">${esc(e.name)}: ${name(PHASEN, e.phase)}${k.ph != null ? `, zuletzt pH ${fmt(k.ph, 1)} und EC ${fmt(k.ec, 2)} (Ziel ${fmt(k.ecZiel, 2)})` : ', noch keine Messung eingetragen'}</p>
      <h2>Wo siehst du es?</h2>
      <div class="orte">${Dk.ORTE.map(([id, l]) => `<button data-act="dokWo" data-id="${id}" aria-pressed="${d.wo === id}">${l}</button>`).join('')}</div>
      ${d.wo ? `<h2>Wie sieht es aus?</h2><p class="leise" style="font-size:16px">Alles antippen, was passt.</p>
        ${symListe.map(([id, l]) => `<button class="sym" data-act="dokSym" data-id="${id}" aria-pressed="${d.sym.has(id)}"><span class="box">${d.sym.has(id) ? '✓' : ''}</span>${Dk.bild(id)}<span>${l}</span></button>`).join('')}` : ''}
      ${erg}
      <div class="knoepfe"><div class="knoepfe-innen"><button class="gross haupt" data-act="dokDiagnose" ${d.wo && d.sym.size ? '' : 'disabled'}>Einschätzung zeigen</button></div></div>`;
  }

  // Welche Art gehört zu welchem Filter
  const KAT = { 'TOP-UP Wasser': 'nach', 'TOP-UP Nährlösung': 'nach', 'Neuansatz': 'neu', 'Spülen': 'neu', 'Messung': 'mess', 'pH korrigiert': 'ph' };
  const kat = x => x.foto ? 'foto' : KAT[x.art] || 'notiz';
  const FILTER = [['alle', 'Alle'], ['nach', 'Nachfüllen'], ['neu', 'Neu ansetzen'], ['mess', 'Messen'], ['ph', 'pH'], ['notiz', 'Notizen'], ['foto', 'Fotos']];
  function eintragHtml(x) {
    if (x.foto) {
      const f = x.foto;
      return `<button class="eintrag" data-act="fotoZeigen" data-id="${esc(f.id)}"><div class="eintrag-kopf"><span>${UI.view === 'verlauf' ? zeit(f.datum) : datum(f.datum)}</span><span>Foto</span></div>
        <img class="mini" src="${fotoUrl(f)}" alt="Foto vom ${esc(datum(f.datum))}">${f.notiz ? `<p class="leise" style="margin:6px 0 0;font-size:16px">${esc(f.notiz)}</p>` : ''}</button>`;
    }
    const w = [];
    if (x.h != null) w.push(`<span><b>${fmt(x.h, 1)}</b> cm</span>`);
    if (x.liter != null) w.push(`<span><b>${fmt(x.liter, 1)}</b> L</span>`);
    if (x.ec != null) w.push(`<span>EC <b>${fmt(x.ec, 2)}</b></span>`);
    if (x.ph != null) w.push(`<span>pH <b>${fmt(x.ph, 1)}</b></span>`);
    if (x.saeureMl != null) w.push(`<span>Säure <b>${fmt(x.saeureMl, 1)}</b> ml</span>`);
    if (x.zusatz) w.push(`<span><b>${esc(x.zusatz)}</b>${x.menge ? ' ' + esc(x.menge) : ''}</span>`);
    const wann = UI.view === 'verlauf' ? zeit(x.datum) : `${datum(x.datum)}, ${esc(Z.eimer[x.eimer] ? Z.eimer[x.eimer].name : '')}`;
    return `<button class="eintrag" data-act="eintragEdit" data-id="${esc(x.id)}"><div class="eintrag-kopf"><span>${wann}${x.geaendert ? '<span class="geaendert">geändert</span>' : ''}</span><span>${esc(artText(x.art))}</span></div>
      ${w.length ? `<div class="eintrag-werte zahl">${w.join('')}</div>` : ''}${x.wasser ? `<p class="leise" style="margin:4px 0 0;font-size:14px">Wasser: ${esc(x.wasser)}</p>` : ''}${x.notiz ? `<p class="leise" style="margin:6px 0 0;font-size:16px">${esc(x.notiz)}</p>` : ''}</button>`;
  }
  const zeit = iso => new Date(iso).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  function tagName(iso) {
    const d = new Date(iso), h = new Date(), g = new Date(Date.now() - 864e5);
    const gleich = (a, b) => a.toDateString() === b.toDateString();
    const lang = d.toLocaleDateString('de-DE', { weekday: 'short', day: 'numeric', month: 'short' });
    return gleich(d, h) ? 'Heute · ' + lang : gleich(d, g) ? 'Gestern · ' + lang : lang;
  }
  // EC-Kurve des laufenden Anbaus
  function kurve(i) {
    const e = Z.eimer[i], pkt = Z.log.filter(x => x.eimer === i && x.ec != null && imAnbau(x, i)).slice(-20);
    if (pkt.length < 2) return '';
    const ziel = zielEC(e), werte = pkt.map(x => x.ec).concat([ziel - 0.3, ziel + 0.3]);
    const lo = Math.min(...werte) - 0.1, hi = Math.max(...werte) + 0.1, W = 320, H = 100;
    const y = v => Math.round((H - (v - lo) / (hi - lo) * H) * 10) / 10, xk = k => Math.round(6 + k * (W - 12) / (pkt.length - 1));
    const linie = pkt.map((x, k) => `${xk(k)},${y(x.ec)}`).join(' ');
    const letzt = pkt[pkt.length - 1];
    return `<div class="kurve"><div class="klein"><span>EC, letzte ${pkt.length} Messungen ${frage('kurve')}</span><span class="zahl">Ziel ${fmt(ziel - 0.3, 1)} bis ${fmt(ziel + 0.3, 1)}</span></div>
      <svg viewBox="0 0 ${W} ${H}" width="100%" height="100" preserveAspectRatio="none" role="img" aria-label="EC-Verlauf, zuletzt ${fmt(letzt.ec, 2)}">
        <rect x="0" y="${y(ziel + 0.3)}" width="${W}" height="${y(ziel - 0.3) - y(ziel + 0.3)}" style="fill:var(--flaeche2)"></rect>
        <polyline points="${linie}" style="fill:none;stroke:var(--akzent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></polyline>
        <circle cx="${xk(pkt.length - 1)}" cy="${y(letzt.ec)}" r="4" style="fill:var(--akzent)"></circle></svg></div>`;
  }

  function vVerlauf() {
    const aktive = Z.eimer.map((e, i) => [i, e]).filter(([, e]) => e.aktiv !== false);
    if (UI.tbTank == null && aktive.length === 1) UI.tbTank = aktive[0][0];
    if (UI.tbTank == null || !Z.eimer[UI.tbTank]) {
      UI.tbTank = null;
      return `<h1>Tagebuch</h1><p class="leise" style="font-size:16px">Welchen Tank willst du ansehen?</p>
        <div class="liste">${aktive.map(([i, e]) => {
          const l = Z.log.filter(x => x.eimer === i && imAnbau(x, i)).slice(-1)[0];
          return `<button class="listen-zeile" data-act="tbTank" data-i="${i}"><span><b>${esc(e.name)}</b><small>${esc(reglerText(e))}</small><small>${l ? 'Zuletzt: ' + esc(vorZeit(l.datum)) + ', ' + esc(artText(l.art)) : 'Noch keine Einträge'}</small></span><span class="pfeil" aria-hidden="true">›</span></button>`;
        }).join('')}</div>` + nav();
    }
    const i = UI.tbTank, e = Z.eimer[i], f = UI.tbFilter || 'alle';
    const alle = Z.log.filter(x => x.eimer === i && imAnbau(x, i))
      .concat(FOTOS.filter(x => x.eimer === i && imAnbau(x, i)).map(ft => ({ foto: ft, datum: ft.datum })))
      .sort((a, b) => b.datum.localeCompare(a.datum));
    const liste = alle.filter(x => f === 'alle' || kat(x) === f);
    let tage = '', letzterTag = '';
    liste.forEach(x => { const t = new Date(x.datum).toDateString(); if (t !== letzterTag) { tage += `<div class="tag-kopf">${esc(tagName(x.datum))}</div>`; letzterTag = t; } tage += eintragHtml(x); });
    const anz = (e.anbauten || []).length;
    return (aktive.length > 1 ? kopf(e.name) : `<h1>${esc(e.name)}</h1>`) + `
      <p class="leise zahl" style="font-size:15px;margin-top:-4px">${esc(reglerText(e))}${e.anbauSeit ? ' · Anbau seit ' + new Date(e.anbauSeit).toLocaleDateString('de-DE', { day: 'numeric', month: 'numeric' }) : ''}</p>
      <button class="zeile-knopf" data-act="eintragWahl" data-i="${i}">+ Eintragen</button>
      ${kurve(i)}
      <div class="filter">${FILTER.map(([id, l]) => `<button data-act="tbFilter" data-f="${id}" aria-pressed="${f === id}">${l}</button>`).join('')}</div>
      ${tage || `<div class="leer">${f === 'alle' ? 'Noch keine Einträge in diesem Anbau.' : 'Dazu gibt es in diesem Anbau noch nichts.'}</div>`}
      ${anz ? `<button class="zeile-knopf doktor" data-act="archiv" data-i="${i}" style="margin-top:16px">Frühere Anbauten (${anz})</button>` : ''}` + nav();
  }

  // ---------- Neue Einträge ----------
  const ETYPEN = [
    ['nachfuellen', 'Nachfüllen', 'Die App rechnet aus, ob Wasser oder Nährlösung nachkommt'],
    ['neu', 'Neu ansetzen', 'Tank leeren und frisch mischen, mit Anleitung'],
    ['mess', 'Messen', 'Füllstand, EC, pH'],
    ['ph', 'pH korrigiert', 'Wie viel Säure du gegeben hast'],
    ['zusatz', 'Zusatz gegeben', 'Zum Beispiel Kaliwasserglas oder Wurzelmittel'],
    ['notiz', 'Notiz', 'Was dir aufgefallen ist'],
    ['foto', 'Foto', 'Wie die Pflanze gerade aussieht'],
  ];
  function vEintragWahl() {
    const e = Z.eimer[UI.eimer];
    return kopf('Eintragen') + `<p class="leise" style="font-size:16px">${esc(e.name)}: Was hast du gemacht?</p>
      <div class="liste">${ETYPEN.slice(0, 4).map(([id, l, t]) => `<button class="listen-zeile" data-act="eintragTyp" data-t="${id}"><span><b>${l}</b><small>${t}</small></span><span class="pfeil" aria-hidden="true">›</span></button>`).join('')}</div>
      <div class="liste">${ETYPEN.slice(4).map(([id, l, t]) => `<button class="listen-zeile" data-act="eintragTyp" data-t="${id}"><span><b>${l}</b><small>${t}</small></span><span class="pfeil" aria-hidden="true">›</span></button>`).join('')}</div>`;
  }
  // Ein Formular für neue und bestehende Einträge. x = bestehender Eintrag oder null
  function eintragFelder(typ, x) {
    const v = (k, d) => UI.eingabe[k] != null ? esc(UI.eingabe[k]) : x && x[k] != null ? (typeof x[k] === 'number' ? fmt(x[k], d) : esc(x[k])) : '';
    const l = letzter(UI.eimer);
    const feld = (id, label, d, ph, text) => `<label class="feld"><span>${label}</span><input type="text" ${text ? 'style="font-size:18px"' : 'inputmode="decimal"'} id="e_${id}" placeholder="${ph || ''}" value="${v(id, d)}"></label>`;
    const f = [];
    if (typ === 'mess' || typ === 'wert') {
      f.push(`<div class="feld-zeile3">${feld('h', 'Füllstand cm', 1, l && l.h != null ? fmt(l.h, 1) : '')}${feld('ec', 'EC', 2, l ? fmt(l.ec, 2) : '')}${feld('ph', 'pH', 1, l && l.ph != null ? fmt(l.ph, 1) : '')}</div>`);
      if (typ === 'mess') f.push('<p class="leise" style="font-size:15px;margin-top:-6px">Grau steht der Wert vom letzten Mal. Du kannst auch nur einen Wert eintragen.</p>');
    }
    if (typ === 'ph' || typ === 'wert') f.push(`<div class="feld-zeile">${feld('saeureMl', 'Säure in ml', 1, 'z. B. 1,5')}${typ === 'ph' ? feld('ph', 'pH danach', 1, 'z. B. 5,9') : ''}</div>`);
    if (typ === 'zusatz') f.push(`<div class="feld-zeile">${feld('zusatz', 'Was', 0, 'Kaliwasserglas', true)}${feld('menge', 'Menge', 0, 'z. B. 2 ml', true)}</div>`);
    f.push(feld('notiz', typ === 'notiz' ? 'Notiz' : 'Notiz (freiwillig)', 0, typ === 'notiz' ? 'z. B. untere Blätter leicht hell' : '', true));
    return f.join('');
  }
  const TYPNAME = { mess: 'Messen', ph: 'pH korrigiert', zusatz: 'Zusatz gegeben', notiz: 'Notiz' };
  function vEintragNeu() {
    const e = Z.eimer[UI.eimer], typ = UI.eTyp;
    return kopf(TYPNAME[typ]) + `<p class="leise" style="font-size:16px">${esc(e.name)}, jetzt</p>${eintragFelder(typ, null)}${fehlerText()}

  }
  const lokal = iso => { const d = new Date(iso), z = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`; };
  function vEintragEdit() {
    const x = Z.log.find(y => y.id === UI.eId);
    if (!x) return vVerlauf();
    const typ = x.art === 'Messung' ? 'mess' : x.art === 'pH korrigiert' ? 'ph' : x.art === 'Zusatz' ? 'zusatz' : x.art === 'Notiz' ? 'notiz' : (x.ec != null || x.h != null || x.ph != null) ? 'wert' : 'notiz';
    return kopf('Eintrag ändern') + `<p class="leise" style="font-size:16px">${esc(artText(x.art))} · ${esc(Z.eimer[x.eimer] ? Z.eimer[x.eimer].name : '')}</p>
      <label class="feld"><span>Wann</span><input type="datetime-local" id="e_datum" value="${esc(UI.eingabe.datum || lokal(x.datum))}"></label>
      ${eintragFelder(typ === 'wert' ? 'wert' : typ, x)}${fehlerText()}
      <button class="zeile-knopf leise-knopf" data-act="eintragLoeschen">Eintrag löschen</button>
      <div class="knoepfe"><div class="knoepfe-innen"><button class="gross haupt" data-act="eintragAendern">Speichern</button></div></div>`;
  }
  // Werte aus dem Formular lesen und prüfen. Gibt Objekt zurück oder setzt UI.fehler.
  function eintragLesen(typ) {
    const n = id => { const el = document.getElementById('e_' + id); if (!el) return undefined; UI.eingabe[id] = el.value; const t = el.value.trim().replace(',', '.'); return t === '' ? null : Number(t); };
    const t = id => { const el = document.getElementById('e_' + id); if (!el) return undefined; UI.eingabe[id] = el.value; return el.value.trim() || null; };
    const o = { h: n('h'), ec: n('ec'), ph: n('ph'), saeureMl: n('saeureMl'), zusatz: t('zusatz'), menge: t('menge'), notiz: t('notiz') };
    Object.keys(o).forEach(k => o[k] === undefined && delete o[k]);
    const hoehe = Z.einst.behaelter.hoehe;
    if (o.h != null && !(o.h > 0 && o.h <= hoehe)) return (UI.fehler = `Der Füllstand sieht nicht richtig aus. Er muss zwischen 0 und ${fmt(hoehe, 1)} cm liegen.`), null;
    if (o.ec != null && !(o.ec > 0 && o.ec < 5)) return (UI.fehler = 'Die EC sieht nicht richtig aus, zum Beispiel 1,6.'), null;
    if (o.ph != null && !(o.ph > 2 && o.ph < 12)) return (UI.fehler = 'Der pH sieht nicht richtig aus, zum Beispiel 5,9.'), null;
    if (o.saeureMl != null && !(o.saeureMl >= 0 && o.saeureMl < 100)) return (UI.fehler = 'Die Säuremenge sieht nicht richtig aus, zum Beispiel 1,5.'), null;
    if ([o.h, o.ec, o.ph, o.saeureMl].some(v => v != null && isNaN(v))) return (UI.fehler = 'Bitte nur Zahlen eintragen, zum Beispiel 1,6.'), null;
    if (typ === 'mess' && o.h == null && o.ec == null && o.ph == null) return (UI.fehler = 'Bitte mindestens einen Wert eintragen.'), null;
    if (typ === 'ph' && o.saeureMl == null && o.ph == null) return (UI.fehler = 'Bitte die Säuremenge oder den pH danach eintragen.'), null;
    if (typ === 'zusatz' && !o.zusatz) return (UI.fehler = 'Bitte eintragen, was du zugegeben hast.'), null;
    if (typ === 'notiz' && !o.notiz) return (UI.fehler = 'Bitte eine Notiz schreiben.'), null;
    UI.fehler = '';
    return o;
  }

  const SETUP_SCHRITTE = 4;
  function vSetup() {
    const E = Z.einst, D = daten(), s = UI.step || 1;
    const kopf = `<p class="setup-kopf">Einrichtung, Schritt ${s} von ${SETUP_SCHRITTE}</p>`;
    let inhalt = '';
    if (s === 1) inhalt = `<img class="logo-gross" src="${LOGO}" alt="Hydro-Assistent" width="520" height="348">
      <p class="leise" style="font-size:17px;text-align:center;margin:-6px 0 18px">Willkommen! In vier kurzen Schritten ist alles eingerichtet.</p>
      <h1>Deine Tanks</h1>
      <p class="leise">Miss einmal nach, dann rechnet die App aus jeder Füllhöhe die Liter aus. Bei einem Tank, der nach unten schmaler wird, nimm „Konisch“.</p>
      <div class="gruppe"><div class="gruppe-titel">Anzahl</div>${segment('anzahl', [1, 2, 3, 4, 5, 6].map(n => [String(n), String(n)]), String(Z.eimer.length)).replace(/data-act="setz"/g, 'data-act="anzahl"')}</div>
      ${behaelterFelder(E.behaelter)}
      <p class="leise zahl" style="font-size:16px">${behaelterText(D)}</p>
      <p class="leise" style="font-size:16px">Die höchste Füllhöhe ist die Marke, bis zu der du auffüllst. Wenn du sie nicht kennst: „Aus Netztopf rechnen“ wählen, dann miss, wie tief der Netztopf in den Tank hineinragt, und wie viel Luft darunter bleiben soll (meist 2 bis 4 cm).</p>`;
    if (s === 2) inhalt = `<h1>Dein Wasser</h1>
      <p class="leise">Damit rechnet die App aus, wie viel Säure nötig ist und was das Wasser schon mitbringt.</p>
      <div class="feld-zeile">
        <label class="feld"><span>EC des Leitungswassers</span><input type="text" inputmode="decimal" id="sEC" value="${fmt(E.wasser.ecGemessen, 2)}"></label>
        <label class="feld"><span>pH des Leitungswassers</span><input type="text" inputmode="decimal" id="sPH" value="${fmt(E.wasser.pH, 1)}"></label>
      </div>
      <div class="gruppe"><div class="gruppe-titel">Karbonathärte, Einheit</div>${segment('kh', [['mmol', 'mmol/L'], ['dh', '°dH']], UI.kh || 'mmol').replace(/data-act="setz"/g, 'data-act="khEinheit"')}</div>
      <label class="feld"><span>Karbonathärte (${(UI.kh || 'mmol') === 'dh' ? '°dH' : 'mmol/L'})</span>
        <input type="text" inputmode="decimal" id="sKH" value="${fmt((UI.kh || 'mmol') === 'dh' ? E.wasser.alkalitaet * 2.8 : E.wasser.alkalitaet, 1)}"></label>
      <p class="leise" style="font-size:16px">EC und pH misst du selbst. Die Karbonathärte steht im Wasserbericht deines Versorgers, meist als „Säurekapazität“ in mmol/L oder als Karbonathärte in °dH. Wenn du sie nicht findest, lass den Wert stehen und korrigiere ihn nach der ersten Mischung anhand der verbrauchten Säure.</p>`;
    if (s === 3) inhalt = `<h1>Deine Säure</h1>
      <p class="leise">Womit senkst du den pH?</p>
      <div class="gruppe">${segment('saeureTyp', [['phosphor', 'Phosphor'], ['salpeter', 'Salpeter'], ['schwefel', 'Schwefel']], E.saeure.typ).replace(/data-act="setz"/g, 'data-act="saeureTyp"')}</div>
      ${E.saeure.typ !== 'phosphor'
        ? `<label class="feld"><span>Konzentration in %</span><input type="text" inputmode="decimal" data-feld="konz" value="${fmt(E.saeure.konz, 0)}"></label>${E.saeure.typ === 'schwefel' ? '<p class="leise" style="font-size:16px">Batteriesäure hat meist 37 bis 38 %. Die Konzentration steht auf dem Etikett.</p>' : ''}`
        : `<div class="gruppe"><div class="gruppe-titel">Konzentration</div>${segment('konz', [['75', '75 %'], ['85', '85 %']], String(E.saeure.konz)).replace(/data-act="setz"/g, 'data-act="konz"')}</div>`}
      <label class="feld"><span>Ziel-pH</span><input type="text" inputmode="decimal" data-feld="zielPH" value="${fmt(E.saeure.zielPH, 1)}"></label>
      <p class="leise" style="font-size:16px">Für DWC sind 5,8 ein guter Wert. Fertige pH-Minus-Mittel aus dem Handel sind meist Phosphorsäure, die Konzentration steht auf dem Etikett.</p>`;
    if (s === 4) {
      const zeile = x => `<button class="schalter" role="switch" aria-checked="${x.an}" data-act="${x.std ? 'vorrat' : 'auswahl'}" data-id="${x.id}">
        <span>${esc(x.name)}<small>${x.an ? 'habe ich' : 'habe ich nicht'}</small></span><span class="pille"></span></button>`;
      inhalt = `<h1>Deine Salze</h1>
        <p class="leise">Schalte ein, was bei dir im Regal steht. Die App plant nur damit.</p>
        ${D.salze.map(s2 => zeile({ id: s2.id, name: s2.name, std: s2.aktiv !== false, an: s2.aktiv !== false ? E.vorrat[s2.id] !== false : E.auswahl[s2.id] === true })).join('')}
        <p class="leise" style="font-size:16px">Alles lässt sich später in den Einstellungen ändern. Dort kannst du auch das Kaliwasserglas als Zusatz einschalten.</p>`;
    }
    return `<div class="setup">${kopf}${inhalt}${fehlerText()}
      <div class="weiter"><div class="knoepfe-innen">
        ${s > 1 ? '<button class="gross" data-act="setupZurueck">Zurück</button>' : ''}
        <button class="gross haupt" data-act="setupWeiter">${s === SETUP_SCHRITTE ? 'Fertig' : 'Weiter'}</button>
      </div></div></div>`;
  }

  const GRUPPEN = [['tanks', 'Tanks'], ['wasser', 'Wasser & Säure'], ['salze', 'Salze & Zusatz'], ['rezepte', 'Rezepte'], ['app', 'App & Sicherung']];
  function gruppeUnter(g, D) {
    const E = Z.einst, akt = Z.eimer.filter(e => e.aktiv !== false);
    if (g === 'tanks') return `${akt.length} ${akt.length === 1 ? 'Tank' : 'Tanks'} · bis ${fmt(D.eimer.maxFuell, 1)} cm, ${fmt(K.liter(D.eimer, D.eimer.maxFuell), 1)} L`;
    if (g === 'wasser') return `${wahlText(E.wasserWahl)}${E.quellen.length ? ' · ' + (E.quellen.length + 1) + ' Quellen' : ''} · ${{ salpeter: 'Salpetersäure', schwefel: 'Schwefelsäure' }[E.saeure.typ] || 'Phosphorsäure'} · Ziel-pH ${fmt(E.saeure.zielPH, 1)}`;
    if (g === 'salze') { const n = D.salze.filter(x => x.aktiv !== false ? E.vorrat[x.id] !== false : E.auswahl[x.id] === true).length; return `${n} Salze eingeplant${E.wasserglas.an ? ' · Kaliwasserglas' : ''}`; }
    if (g === 'rezepte') return akt.map(e => `${e.name}: ${name(PHASEN, e.phase)}`).join(' · ');
    return sync === 'konto' ? 'Im Konto gespeichert · Anleitung · Einrichtung' : 'Sicherung · Anleitung · Einrichtung';
  }
  function vEinst() {
    const D = daten();
    return `<h1>Einstellungen</h1>
      <div class="liste">${GRUPPEN.map(([id, t]) => `<button class="listen-zeile" data-act="einstGruppe" data-g="${id}"><span><b>${esc(t)}</b><small class="zahl">${esc(gruppeUnter(id, D))}</small></span><span class="pfeil" aria-hidden="true">›</span></button>`).join('')}</div>
      <p class="leise" style="font-size:15px">Änderungen gelten sofort. Hast du dich vertippt, erscheint unten kurz „Rückgängig“.</p>` + nav();
  }
  // Wie hart ist das Standardwasser, und welche Salze passen dazu?
  function haerte() {
    const w = wasserMisch(Z.einst.wasserWahl), alk = w.alkalitaet || 0, ca = w.Ca || 0;
    if (alk >= 2.5 || ca >= 80) return { art: 'hart', text: `Dein Wasser ist hart (Karbonathärte ${fmt(alk * 2.8, 0)} °dH, Calcium ${fmt(ca, 0)} mg/L). Es bringt viel Calcium mit und braucht viel Säure${Z.einst.saeure.typ === 'phosphor' ? ' (mit Phosphorsäure oft zu viel Phosphor, besser Schwefelsäure, siehe Wasser & Säure)' : ''}. Diese Salze passen dazu besonders gut:`,
      salze: [['mgno3', 'Stickstoff ohne Calcium, dazu Magnesium. Ersetzt einen Teil vom Calciumnitrat.'], ['kno3', 'Stickstoff und Kalium ohne Calcium.'], ['k2so4', 'Kalium für die Blüte, ohne zusätzlichen Stickstoff.'], ['nh4so4', 'Ein wenig Ammonium hält den pH an den Wurzeln stabiler. Die App nimmt davon nur wenig.']].concat(Z.einst.saeure.typ === 'phosphor' ? [] : [['mkp', 'Phosphor und Kalium. Wichtig, weil deine Säure keinen Phosphor mitbringt.']]) };
    if (alk < 1 && ca < 20) return { art: 'weich', text: `Dein Wasser ist weich (Karbonathärte ${fmt(alk * 2.8, 0)} °dH, Calcium ${fmt(ca, 0)} mg/L). Calcium und Magnesium müssen fast ganz aus dem Dünger kommen, und die wenige Säure bringt kaum Phosphor. Diese Salze passen dazu besonders gut:`,
      salze: [['calcinit', 'Die wichtigste Calciumquelle.'], ['bittersalz', 'Magnesium und Schwefel.'], ['mkp', 'Phosphor und Kalium.'], ['map', 'Phosphor und etwas Ammonium, das den pH stabiler hält.']] };
    return null;
  }
  function vEinstGruppe() {
    const g = UI.gruppe || 'tanks', E = Z.einst, D = daten();
    const salzZeile = s => {
      const std = s.aktiv !== false;
      const an = std ? E.vorrat[s.id] !== false : E.auswahl[s.id] === true;
      const wartet = s.nurMitSalpeter && E.saeure.typ !== 'salpeter';
      return `<button class="schalter" role="switch" aria-checked="${an}" data-act="${std ? 'vorrat' : 'auswahl'}" data-id="${s.id}">
        <span>${esc(s.name)}<small>${wartet ? (an ? 'vorrätig, wird erst mit Salpetersäure eingeplant' : 'nicht vorrätig') : std ? (an ? 'vorrätig, wird eingeplant' : 'nicht vorrätig') : (an ? 'wird zusätzlich eingeplant' : 'nicht eingeplant')}</small></span><span class="pille"></span></button>`;
    };

  function render() {
    if (!Z.einst.setup) { document.getElementById('app').innerHTML = vSetup(); return; }
    const v = { start: vStart, eimer: vEimer, neu: vNeu, topup: vTopup, anleitung: vAnleitung, verlauf: vVerlauf, einst: vEinst, einstGruppe: vEinstGruppe, doktor: vDoktor, hilfe: vHilfe, hilfeStart: vHilfeStart, anbauEnde: vAnbauEnde, eintragWahl: vEintragWahl, runde: vRunde, problem: vProblem, eintragNeu: vEintragNeu, eintragEdit: vEintragEdit, archiv: vArchiv, archivAnbau: vArchivAnbau, fotos: vFotos, foto: vFoto }[UI.view] || vStart;
    document.getElementById('app').innerHTML = v() + blattHtml();
  }
  function gehe(v) { if (v !== 'neu' && v !== 'topup') { UI.wasserEinmal = null; UI.wasserPanel = false; } UI.erkl = null; UI.view = v; UI.fehler = ''; UI.kalEdit = false; UI.namenEdit = false; UI.info = null; UI.masse = false; render(); window.scrollTo(0, 0); }

  // ---------- Aktionen ----------
  const A = {
    tab: d => { UI.tab = d.v; if (d.v === 'verlauf') UI.tbTank = null; gehe(d.v); },
    einstGruppe: d => { UI.tab = 'einst'; UI.gruppe = d.g; gehe('einstGruppe'); },
    oeffne: d => { UI.eimer = +d.i; UI.eingabe = {}; gehe('eimer'); },
    zurueck: () => {
      if (UI.namenEdit) { UI.namenEdit = false; UI.fehler = ''; return render(); }
      if (UI.view === 'anleitung' && UI.haken.size > 0 && !confirm('Anleitung verlassen? Die Haken gehen verloren.')) return;
      const v = UI.view;
      if (v === 'foto' && ['archivAnbau', 'verlauf', 'eimer'].includes(UI.fotoVon)) return gehe(UI.fotoVon);
      if (v === 'verlauf' && UI.tbTank != null) { UI.tbTank = null; return gehe('verlauf'); }
      if (v === 'eintragWahl' || v === 'eintragEdit') return gehe(UI.eVon || 'eimer');
      if (v === 'eintragNeu') return gehe(UI.eVon && UI.eVon !== 'eintragWahl' && !['eimer', 'verlauf'].includes(UI.eVon) ? UI.eVon : 'eintragWahl');
      if (v === 'runde') { UI.runde = null; return gehe('start'); }
      if (v === 'problem') return gehe('doktor');
      gehe(v === 'eimer' ? 'start' : v === 'hilfe' ? (UI.hilfeVon || 'start') : v === 'doktor' ? (UI.dokVon || 'eimer')

    },
    gehe: d => { UI.eingabe = {}; if (d.v === 'anbauEnde') { UI.ende = null; UI.fehler = ''; } gehe(d.v); },
    setz: d => {
      const i = d.i != null ? +d.i : UI.eimer, e = Z.eimer[i], alt = e[d.feld];
      e[d.feld] = d.wert;
      if (d.feld === 'phase' && alt !== d.wert) phaseNotieren(i, alt, d.wert);
      speichern(); render();
    },
    rechneNeu: (dd, el, sofort) => {
      const h = zahl('#h'), D = daten(Z.eimer[UI.eimer]);
      UI.eingabe.h = document.getElementById('h').value;
      if (!(h > 0 && h <= D.eimer.hoehe)) { UI.fehler = 'Bitte eine Füllhöhe zwischen 1 und ' + fmt(D.eimer.hoehe, 1) + ' cm eingeben.'; return render(); }
      const e = Z.eimer[UI.eimer];
      if (!sofort) { UI.rechnet = true; render(); setTimeout(() => A.rechneNeu(null, null, true), 30); return; }
      UI.rechnet = false;
      if (optE(e).spuelen) {
        const L = K.liter(D.eimer, h), sa = K.saeure(D.wasser, D.saeure, D.kalibrierung);
        const ml = Math.round(sa.mmol * L / sa.mmolProMl * 10) / 10, ecEnde = D.wasser.ecGemessen + D.kalibrierung.ecProMmolSaeure * sa.mmol * (sa.ecFaktor || 1);
        UI.anl = { art: 'Spülen', titel: 'Spülen', text: `${e.name} auf ${fmt(h, 1)} cm, nur Wasser und Säure.`, h, liter: L, ecZiel: ecEnde, ecErwartet: ecEnde, ecVorSaeure: null,
          hinweise: ['Kein Dünger und kein Kaliwasserglas.'],
          schritte: [{ menge: fmt(h, 1) + ' cm', was: 'Tank bis zu dieser Höhe mit Wasser füllen.' },
            ml > 0 ? { menge: 'ca. ' + fmt(ml, 1) + ' ml', was: sa.name + ' zugeben und umrühren. Säure immer ins Wasser.' } : null,
            { menge: 'pH ' + fmt(Z.einst.saeure.zielPH, 1), was: 'pH messen und falls nötig nachkorrigieren.' }].filter(Boolean) };
        UI.anl.wasser = wahlText(wasserWahlFuer(e)); UI.haken = new Set(); UI.eingabe = {}; return gehe('anleitung');
      }
      const ueber = h > D.eimer.maxFuell;
      if (ueber) { D.eimer.maxFuell = h; D.eimer.zielFuell = h; } // bewusst höher, z. B. in der Anzucht
      const r = K.vollansatz(D, Object.assign({ phase: e.phase, typ: e.typ, staerke: e.staerke, fuellhoehe: h }, ctx(e), optE(e)));
      if (ueber) r.hinweise.unshift(`${fmt(h, 1)} cm liegen über deiner normalen Marke von ${fmt(maxFuell(Z.einst.behaelter), 1)} cm. In der Anzucht ist das richtig, damit das Wasser den Netztopf berührt. Später brauchen die Wurzeln den Luftspalt.`);
      UI.anl = { art: 'Neuansatz', titel: 'Neu ansetzen', text: `${e.name} auf ${fmt(r.fuellhoehe, 1)} cm, Ziel-EC ${fmt(r.ecZiel, 2)}.`,
        h: r.fuellhoehe, liter: r.liter, ecZiel: r.ecZiel, ecErwartet: r.ec.gesamt, ecVorSaeure: r.saeure.ml > 0 ? r.ec.vorSaeure + (r.saeure.zuerstMl / r.saeure.ml) * (r.ec.saeure || 0) : null, hinweise: r.hinweise, schritte: schritteEimer(r, r.fuellhoehe),
        werte: { N: r.ist.N, P: r.ist.P, K: r.ist.K, Ca: r.ist.Ca, Mg: r.ist.Mg },
        werteSoll: { N: r.soll.N, P: r.soll.P, K: r.soll.K, Ca: r.soll.Ca, Mg: r.soll.Mg },
        wasserWerte: { N: (D.wasser.NO3 || 0) + (D.wasser.NH4 || 0), P: D.wasser.P || 0, K: D.wasser.K || 0, Ca: D.wasser.Ca || 0, Mg: D.wasser.Mg || 0 } };
      UI.anl.wasser = wahlText(wasserWahlFuer(e)); UI.haken = new Set(); UI.eingabe = {}; gehe('anleitung');
    },
    rechneTopup: (dd, el, sofort) => {
      const hj = zahl('#hj'), ecj = zahl('#ecj'), D = daten(Z.eimer[UI.eimer]);
      UI.eingabe.hj = document.getElementById('hj').value; UI.eingabe.ecj = document.getElementById('ecj').value;
      const hzielEl = document.getElementById('hziel');
      UI.eingabe.hziel = hzielEl ? hzielEl.value : '';
      const hZielWunsch = zahl('#hziel');
      UI.info = null;
      if (!(hj > 0 && hj <= D.eimer.hoehe)) { UI.fehler = 'Bitte die aktuelle Füllhöhe in cm eingeben.'; return render(); }
      if (!(ecj > 0 && ecj < 5)) { UI.fehler = 'Bitte die gemessene EC eingeben, zum Beispiel 1,40.'; return render(); }
      UI.fehler = '';
      const e = Z.eimer[UI.eimer];
      if (!sofort) { UI.rechnet = true; render(); setTimeout(() => A.rechneTopup(null, null, true), 30); return; }
      UI.rechnet = false;
      if (hZielWunsch > D.eimer.maxFuell && hZielWunsch <= D.eimer.hoehe) { D.eimer.maxFuell = hZielWunsch; D.eimer.zielFuell = hZielWunsch; }
      if (optE(e).spuelen) {
        const hZ = Math.min(hZielWunsch > 0 ? hZielWunsch : D.eimer.zielFuell, D.eimer.hoehe);
        const vJ = K.liter(D.eimer, hj), vZ = K.liter(D.eimer, hZ), fehlt = vZ - vJ;
        if (fehlt < 0.2) { UI.info = 'Tank ist voll genug, nichts nachfüllen.'; return render(); }
        const sa = K.saeure(D.wasser, D.saeure, D.kalibrierung), ml = Math.round(sa.mmol * fehlt / sa.mmolProMl * 10) / 10;
        const ecDanach = (ecj * vJ + D.wasser.ecGemessen * fehlt) / vZ;
        UI.anl = { art: 'TOP-UP Wasser', titel: 'Nur Wasser', text: `Spülen: ${fmt(fehlt, 1)} L Wasser nachfüllen.`, h: hZ, liter: fehlt, ecZiel: zielEC(e), ecErwartet: ecDanach, hinweise: ['Kein Dünger und kein Kaliwasserglas.'],
          schritte: [{ menge: fmt(fehlt, 1) + ' L', was: `Wasser nachfüllen, bis ${fmt(hZ, 0)} cm erreicht sind.` },
            ml > 0 ? { menge: 'ca. ' + fmt(ml, 1) + ' ml', was: 'Säure zugeben und umrühren.' } : null,
            { menge: 'pH ' + fmt(Z.einst.saeure.zielPH, 1), was: 'pH messen und falls nötig nachkorrigieren.' }].filter(Boolean), vorher: { h: hj, ec: ecj } };
        UI.haken = new Set(); UI.eingabe = {}; return gehe('anleitung');
      }
      const t = K.topUp(D, Object.assign({ phase: e.phase, typ: e.typ, staerke: e.staerke, hJetzt: hj, ecJetzt: ecj }, (hZielWunsch > 0 && hZielWunsch <= D.eimer.hoehe ? { hZiel: hZielWunsch } : {}), ctx(e), optE(e)));
      const hZiel = Math.min(hZielWunsch > 0 ? hZielWunsch : D.eimer.zielFuell, D.eimer.hoehe);
      if (t.fall === '–') { UI.info = t.text + (t.hinweise.length ? ' ' + t.hinweise.join(' ') : ''); return render(); }
      if (t.fall === 'A') {
        const s = [], wgA = t.wasserglasMl > 0;

      speichern(); UI.eingabe = {}; gehe(UI.eVon || 'verlauf'); toast('Eintrag gelöscht', r);
    },
    erklaer: d => { UI.erkl = d.k; render(); },
    erklaerZu: (d, el, ev) => { UI.erkl = null; render(); },
    dokModus: d => { UI.dokModus = d.wert; render(); window.scrollTo(0, 0); },
    problem: d => { UI.problem = d.id; UI.problemWahl = false; gehe('problem'); },
    problemNotieren: () => {
      const akt = Z.eimer.map((e, i) => [i, e]).filter(([, e]) => e.aktiv !== false);
      if (akt.length === 1) return A.problemTank({ i: String(akt[0][0]) });
      UI.problemWahl = true; render();
    },
    problemTank: d => {
      const u = Dk.URSACHEN.find(x => x.id === UI.problem), i = +d.i, r = schnapp();
      Z.log.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), eimer: i, datum: new Date().toISOString(), art: 'Pflanzendoktor',
        h: null, liter: null, ec: null, ph: null, saeureMl: null, notiz: `Nachgeschlagen, Verdacht: ${u.titel}.` });
      speichern(); UI.problemWahl = false; render(); toast(`Bei ${Z.eimer[i].name} notiert`, r);
    },
    wasserPanel: () => { merkeEingaben(); UI.wasserPanel = !UI.wasserPanel; render(); },
    wWahl: d => {
      merkeEingaben();
      let w;
      if (d.ziel === 'std') w = Z.einst.wasserWahl = wahlSauber(Z.einst.wasserWahl);
      else if (d.ziel === 'tank') {
        const e = Z.eimer[+d.i];
        if (d.teil === 'modus') { if (d.wert === 'std') delete e.wasser; else e.wasser = wahlSauber(Z.einst.wasserWahl); speichern(); return render(); }
        w = e.wasser = wahlSauber(e.wasser);
      } else w = UI.wasserEinmal = wahlSauber(UI.wasserEinmal || wasserWahlFuer(Z.eimer[UI.eimer]));
      const andere = quellenListe().map(q => q[0]);
      if (d.teil === 'a') { w.a = d.wert; if (w.b === w.a) { const x = andere.find(id => id !== w.a); if (x) w.b = x; else { delete w.b; delete w.anteil; } } }
      if (d.teil === 'misch') { if (w.b) { delete w.b; delete w.anteil; } else { w.b = andere.find(id => id !== w.a); w.anteil = 50; } }
      if (d.teil === 'b') w.b = d.wert;
      if (d.teil === 'anteil') w.anteil = +d.wert;
      if (d.ziel !== 'einmal') speichern();
      render();
    },
    quelleOffen: d => { UI.quelleOffen = UI.quelleOffen === d.id ? null : d.id; render(); },
    quelleNeu: d => {
      const v = VORLAGEN[d.t], r = schnapp(), n = Z.einst.quellen.filter(q => q.vorlage === d.t).length;
      const werte = d.t === 'eigen' ? { ecGemessen: Z.einst.wasser.ecGemessen, pH: Z.einst.wasser.pH, alkalitaet: Z.einst.wasser.alkalitaet } : Object.assign({}, v.werte);
      const qid = 'q' + Date.now().toString(36); UI.quelleOffen = qid;
      Z.einst.quellen.push({ id: qid, vorlage: d.t, name: v.name + (n ? ' ' + (n + 1) : ''), werte });
      speichern(); render(); toast(v.name + ' hinzugefügt', r);
    },
    quelleWeg: d => {
      const r = schnapp(), q = Z.einst.quellen.find(x => x.id === d.id);
      Z.einst.quellen = Z.einst.quellen.filter(x => x.id !== d.id);
      Z.einst.wasserWahl = wahlSauber(Z.einst.wasserWahl);
      Z.eimer.forEach(e => { if (e.wasser) e.wasser = wahlSauber(e.wasser); });
      speichern(); render(); toast((q ? q.name : 'Quelle') + ' entfernt', r);
    },
    masse: () => { merkeEingaben(); UI.masse = !UI.masse; render(); },
    spuelen: d => { const e = Z.eimer[d.i != null ? +d.i : UI.eimer]; e.spuelen = !e.spuelen; speichern(); render(); toast(e.spuelen ? 'Spülen an' : 'Spülen aus'); },
    spar: d => { const e = Z.eimer[d.i != null ? +d.i : UI.eimer]; e.spar = !e.spar; speichern(); render(); toast(e.spar ? 'Sparmodus an' : 'Sparmodus aus'); },
    klappen: d => { const e = Z.eimer[+d.i]; e.zu = !e.zu; speichern(); render(); },
    khEinheit: d => { UI.kh = d.wert; render(); },
    setupWeiter: () => {
      const s = UI.step || 1;
      // Felder übernehmen, auch wenn die Tastatur noch offen ist (dann fehlt das change-Ereignis)
      document.querySelectorAll('#app input[data-feld]').forEach(el => el.dispatchEvent(new Event('change', { bubbles: true })));
      if (s === 2) {
        const ec = zahl('#sEC'), ph = zahl('#sPH'), kh = zahl('#sKH');
        if (!(ec >= 0 && ec < 2)) { UI.fehler = 'Bitte die EC des Leitungswassers eintragen, zum Beispiel 0,37.'; return render(); }
        if (!(ph > 4 && ph < 10)) { UI.fehler = 'Bitte den pH des Leitungswassers eintragen, zum Beispiel 7,6.'; return render(); }
        const mmol = (UI.kh === 'dh' ? kh / 2.8 : kh);
        if (!(mmol >= 0 && mmol <= 10)) { UI.fehler = 'Bitte die Karbonathärte eintragen.'; return render(); }
        Object.assign(Z.einst.wasser, { ecGemessen: ec, pH: ph, alkalitaet: Math.round(mmol * 100) / 100 });
      }
      UI.fehler = '';
      if (s < SETUP_SCHRITTE) { UI.step = s + 1; speichern(); render(); window.scrollTo(0, 0); return; }
      Z.einst.setup = true; UI.step = 1; UI.tab = 'start'; speichern(); gehe('start'); toast('Fertig eingerichtet. Die Anleitung findest du unter Hilfe');
    },
    setupZurueck: () => { UI.step = Math.max(1, (UI.step || 1) - 1); UI.fehler = ''; render(); window.scrollTo(0, 0); },
    setupNeu: () => { Z.einst.setup = false; UI.step = 1; speichern(); render(); window.scrollTo(0, 0); },
    behModus: d => { merkeEingaben(); Z.einst.behaelter.modus = d.wert; speichern(); render(); },
    behForm: d => { merkeEingaben(); Z.einst.behaelter.form = d.wert; speichern(); render(); },
    anzahl: d => {
      const n = +d.wert, r = schnapp(), vorher = Z.eimer.filter(e => e.aktiv !== false).length;
      while (Z.eimer.length < n) Z.eimer.push({ name: 'Tank ' + (Z.eimer.length + 1), phase: 'wachstum', typ: 'photo', staerke: 'normal' });
      if (n < Z.eimer.length) {
        if (Z.log.some(x => x.eimer >= n)) { Z.eimer.forEach((e, i) => { if (i >= n) e.aktiv = false; }); }
        else Z.eimer = Z.eimer.slice(0, n);
      }
      Z.eimer.slice(0, n).forEach(e => delete e.aktiv);
      if (UI.eimer >= Z.eimer.length) UI.eimer = 0;
      speichern(); render();
      if (n < vorher) toast(Z.eimer.length > n ? 'Ausgeblendet, Tagebuch bleibt erhalten' : 'Weniger Tanks', r);
    },
    eimerAktiv: d => {
      const e = Z.eimer[+d.i];
      if (e.aktiv !== false && Z.eimer.filter(x => x.aktiv !== false).length === 1) { toast('Ein Tank muss sichtbar bleiben'); return; }
      e.aktiv = e.aktiv === false; speichern(); render();
    },
    wasserglas: () => { Z.einst.wasserglas.an = !Z.einst.wasserglas.an; speichern(); render(); },
    konz: d => { Z.einst.saeure.konz = +d.wert; speichern(); render(); },
    export: async () => {
      const text = JSON.stringify(Z, null, 1), fn = 'hydro-sicherung-' + new Date().toISOString().slice(0, 10) + '.json';
      if (downloads) {
        try { await downloads.save({ filename: fn, data: text }); toast('Sicherung gespeichert'); }
        catch (e) { if (e && e.code !== 'declined') toast('Speichern ging nicht'); }
        return;
        return;
      }
      if (!window.claude) { // eigene Seite (z. B. GitHub): normaler Download
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = fn;
        document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        toast('Sicherung gespeichert'); return;
      }
      try { await navigator.clipboard.writeText(text); toast('Sicherung kopiert'); } catch (e) { toast('Kopieren ging nicht'); }
    },
    import: () => document.getElementById('datei').click(),
  };

  document.getElementById('app').addEventListener('click', ev => {
    const b = ev.target.closest('[data-act]'); if (!b) return;
    if (b.classList.contains('blatt-hg') && ev.target !== b) return;
    const f = A[b.dataset.act]; if (f) f(b.dataset, b);
  });
  document.getElementById('app').addEventListener('change', ev => {
    const el = ev.target;
    if (el.dataset && el.dataset.name) {
      const q = Z.einst.quellen.find(x => x.id === el.dataset.name), n = el.value.trim().replace(/\s+/g, ' ').slice(0, 24);
      if (!q || !n) { setTimeout(render, 0); return; }
      const r = schnapp(); q.name = n; speichern(); setTimeout(render, 0); toast('Übernommen', r); return;
    }
    const f = el.dataset && el.dataset.feld; if (!f) return;
    if (f.startsWith('q:')) {
      const [, id, key] = f.split(':'), q = Z.einst.quellen.find(x => x.id === id), n = Number(el.value.trim().replace(',', '.'));
      const gr = { ecGemessen: [0, 2], pH: [4, 10], alkalitaet: [0, 10], Ca: [0, 300], Mg: [0, 150], S: [0, 300] }[key];
      if (!q || !gr || isNaN(n) || n < gr[0] || n > gr[1]) { toast('Wert außerhalb des sinnvollen Bereichs, bitte prüfen'); setTimeout(render, 0); return; }
      const r = schnapp(); q.werte[key] = n; speichern(); setTimeout(render, 0); toast('Übernommen', r); return;
    }
    const n = Number(el.value.trim().replace(',', '.'));
    const grenzen = { K: [0, 100], NO3: [0, 150], Ca: [0, 300], Mg: [0, 150], S: [0, 300], netztopf: [0, 60], luftspalt: [0, 40], dOben: [5, 200], dUnten: [5, 200], durchmesser: [5, 200], laenge: [5, 300], breite: [5, 300], hoehe: [5, 250], maxFuell: [2, 250], wgDosis: [0.02, 0.5], konz: [1, 98], zielPH: [4.5, 7], ecGemessen: [0, 2], pH: [5, 9.5], alkalitaet: [0, 10] };
    merkeEingaben();
    if (isNaN(n) || !grenzen[f] || n < grenzen[f][0] || n > grenzen[f][1]) { toast('Wert außerhalb des sinnvollen Bereichs, bitte prüfen'); setTimeout(render, 0); return; }
    const r = schnapp();
    if (['dOben', 'dUnten', 'durchmesser', 'laenge', 'breite', 'hoehe', 'maxFuell', 'netztopf', 'luftspalt'].includes(f)) {
      const b = Z.einst.behaelter;
      if (f === 'maxFuell' && n > b.hoehe) { toast('Höher als der Tank selbst'); setTimeout(render, 0); return; }
      if ((f === 'netztopf' || f === 'luftspalt') && b.hoehe - n - (f === 'netztopf' ? b.luftspalt : b.netztopf) < 1) { toast('Dann bliebe kein Platz für Wasser'); setTimeout(render, 0); return; }
      if (f === 'hoehe' && n < b.maxFuell) b.maxFuell = n;
      b[f] = n;
      speichern(); setTimeout(render, 0); toast('Übernommen', r); return;
    }
    if (f === 'konz' && Z.einst.saeure.typ === 'salpeter' && n > 65) { toast('Salpetersäure gibt es höchstens mit 65 %, bitte prüfen'); setTimeout(render, 0); return; }
    if (f === 'wgDosis') Z.einst.wasserglas.mlProL = n; else if (f === 'konz' || f === 'zielPH') Z.einst.saeure[f] = n; else Z.einst.wasser[f] = n;
    speichern(); setTimeout(render, 0); toast('Übernommen', r);
  });
  document.getElementById('toast').addEventListener('click', ev => {
    if (!ev.target.closest('[data-rueck]') || !toast.rueck) return;
    const f = toast.rueck; toast.rueck = null; clearTimeout(toast.t);
    document.getElementById('toast').classList.remove('an', 'mit');
    f(); setTimeout(() => toast('Rückgängig gemacht'), 50);
  });
  document.getElementById('app').addEventListener('keydown', ev => {
    if (ev.key !== 'Enter' || ev.target.tagName !== 'INPUT') return;
    ev.preventDefault();
    if (ev.target.id === 'eimerName') return A.namenSpeichern();
    if (ev.target.id === 'fotoNotiz') { A.fotoNotizSpeichern(); return ev.target.blur(); }
    ev.target.blur(); // Tastatur schließen, geänderte Werte werden dabei übernommen
  });
  document.getElementById('fotoDatei').addEventListener('change', async ev => {
    const dateien = [...(ev.target.files || [])];
    ev.target.value = '';
    if (!dateien.length) return;
    toast(dateien.length > 1 ? 'Fotos werden gespeichert …' : 'Foto wird gespeichert …');
    for (const datei of dateien) {
      try {
        const blob = await verkleinern(datei);
        const rec = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), eimer: UI.eimer, datum: new Date().toISOString(), notiz: '', blob };
        await dbTun('readwrite', st => st.put(rec));
        FOTOS.unshift(rec);
      } catch (e) { fotoFehler = true; toast('Foto konnte nicht gespeichert werden'); }
    }
    if (UI.view === 'eintragWahl' && UI.fotoZiel) { UI.view = UI.fotoZiel; UI.fotoZiel = null; }
    render();
    if (!fotoFehler) toast(dateien.length > 1 ? dateien.length + ' Fotos gespeichert' : 'Foto gespeichert');
  });
  document.getElementById('datei').addEventListener('change', ev => {
    const file = ev.target.files && ev.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!d || !Array.isArray(d.eimer) || !d.einst) throw new Error();
        if (!confirm('Sicherung laden? Die aktuellen Daten werden dadurch ersetzt.')) return;
        Z = pruefe(d); speichern(); render(); toast('Sicherung geladen');
      } catch (e) { toast('Das ist keine gültige Sicherung'); }
      ev.target.value = '';
    };
    r.readAsText(file);
  });

  render();
  if ('serviceWorker' in navigator && !window.claude && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  // Manche Hoster blenden unten rechts ein eigenes Abzeichen ein. Dann rücken die Knöpfe nach links.
  function eckePruefen() {
    const badge = document.querySelector('[id*="netlify"], [class*="netlify"], [data-netlify-badge], #wm-badge');
    let sichtbar = false;
    if (badge) { const r = badge.getBoundingClientRect(); sichtbar = r.width > 0 && r.height > 0 && getComputedStyle(badge).visibility !== 'hidden'; }
    document.documentElement.style.setProperty('--ecke', sichtbar ? '58px' : '0px');
  }
  setTimeout(eckePruefen, 1200); setTimeout(eckePruefen, 4000);
  fotosLaden().then(() => { if (FOTOS.length) render(); });
})();
</script>
