<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13201E">
<title>Hydro-Assistent</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #13201E; --flaeche: #1C2D2A; --flaeche2: #253B37; --linie: #35524B;
  --text: #E7EFEB; --leise: #B7C9C2; --leiser: #9DB3AB; --akzent: #F0B44C; --akzent-text: #221804;
  --gut: #8CC9A8; --fehler: #EF8177;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #13201E; --flaeche: #1C2D2A; --text: #E7EFEB; } }
:root[data-theme="dark"] { --bg: #13201E; --flaeche: #1C2D2A; --text: #E7EFEB; }
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
  font-family: "Atkinson Hyperlegible", "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 18px; line-height: 1.45; -webkit-tap-highlight-color: transparent;
}
.zahl { font-variant-numeric: tabular-nums; }
#app { max-width: 560px; margin: 0 auto; padding: 16px 16px 120px; }
h1 { font-size: 28px; line-height: 1.2; margin: 8px 0 20px; font-weight: 700; }
h2 { font-size: 20px; margin: 28px 0 12px; font-weight: 700; }
p { margin: 0 0 12px; }
.leise { color: var(--leise); }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--akzent); outline-offset: 2px; }

.kopf { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; }
.kopf h1 { margin: 0; }
.zurueck { width: 48px; height: 48px; border-radius: 24px; font-size: 26px; background: var(--flaeche); flex: none; }

.eimer { display: block; width: 100%; text-align: left; background: var(--flaeche); border-radius: 18px; padding: 18px; margin-bottom: 14px; border: 2px solid transparent; }
.eimer:active { border-color: var(--linie); }
.eimer-oben { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.eimer-name { font-size: 22px; font-weight: 700; }
.ec-gross { font-size: clamp(30px, 9vw, 40px); font-weight: 700; line-height: 1; color: var(--akzent); }
.ec-gross small { font-size: 13px; font-weight: 400; color: var(--leiser); display: block; text-align: right; margin-top: 4px; white-space: nowrap; }
.eimer-zeile { color: var(--leise); margin-top: 6px; font-size: 16px; }

.gruppe { margin: 0 0 18px; }
.gruppe-titel { color: var(--leise); font-size: 15px; margin-bottom: 6px; }
.segment { display: flex; background: var(--flaeche); border-radius: 14px; padding: 4px; gap: 4px; }
.segment button { flex: 1; min-height: 52px; border-radius: 11px; font-size: 16px; padding: 4px 6px; }
.segment button[aria-pressed="true"] { background: var(--akzent); color: var(--akzent-text); font-weight: 700; }

.ziel { display: flex; align-items: baseline; gap: 12px; background: var(--flaeche); border-radius: 18px; padding: 16px 18px; margin: 6px 0 18px; }
.ziel .ec-gross { font-size: 52px; }

.knoepfe { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, var(--bg) 30%); }
.knoepfe-innen { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; }
.gross { flex: 1; min-height: 64px; border-radius: 16px; font-size: 20px; font-weight: 700; background: var(--flaeche2); }
.gross.haupt { background: var(--akzent); color: var(--akzent-text); }
.gross.ruhig { background: transparent; border: 2px solid var(--linie); color: var(--text); font-weight: 400; }
.gross:disabled { opacity: .4; }

.nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--flaeche); border-top: 1px solid var(--linie); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav-innen { max-width: 560px; margin: 0 auto; display: flex; }
.nav button { flex: 1; min-height: 64px; font-size: 15px; padding: 0 2px; color: var(--leise); }
.nav button[aria-current="page"] { color: var(--akzent); font-weight: 700; background: var(--flaeche2); box-shadow: inset 0 2px 0 0 var(--akzent); }

label.feld { display: block; margin-bottom: 16px; }
label.feld span { display: block; color: var(--leise); font-size: 15px; margin-bottom: 6px; }
input[type="text"], select {
  width: 100%; min-height: 60px; border-radius: 14px; border: 2px solid var(--linie);
  background: var(--flaeche); color: var(--text); font: inherit; font-size: 26px; padding: 8px 16px;
}
input::placeholder { color: var(--leise); opacity: .6; }
.feld-zeile { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.feld-zeile3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.feld-zeile2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.feld-zeile3 input { font-size: 22px; padding: 8px 10px; }

.hinweise { border-left: 4px solid var(--akzent); background: var(--flaeche); border-radius: 0 14px 14px 0; padding: 12px 16px; margin: 0 0 18px; }
.hinweise p { font-size: 16px; margin: 0 0 6px; }
.hinweise p:last-child { margin: 0; }
.fehlertext { color: var(--fehler); font-size: 16px; margin: -8px 0 14px; }

.schritte { list-style: none; margin: 0 0 8px; padding: 0; counter-reset: s; }
.schritt { display: flex; gap: 14px; align-items: flex-start; width: 100%; text-align: left; background: var(--flaeche); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; min-height: 64px; }
.schritt .nr { flex: none; width: 34px; height: 34px; border-radius: 17px; border: 2px solid var(--linie); display: grid; place-items: center; font-weight: 700; font-size: 16px; }
.schritt .menge { font-size: 26px; font-weight: 700; display: block; line-height: 1.2; }
.schritt .was { display: block; }
.schritt[aria-pressed="true"] { background: transparent; border: 2px dashed var(--linie); padding: 12px 14px; }
.schritt[aria-pressed="true"] .nr { background: var(--gut); border-color: var(--gut); color: var(--bg); }
.schritt[aria-pressed="true"] .menge, .schritt[aria-pressed="true"] .was { color: var(--leise); text-decoration: line-through; }

.zusammen { display: flex; gap: 18px; flex-wrap: wrap; margin: 0 0 16px; }
.zusammen div { font-size: 15px; color: var(--leise); }
.zusammen b { display: block; font-size: 24px; color: var(--text); }

.eintrag { background: var(--flaeche); border-radius: 14px; padding: 12px 16px; margin-bottom: 10px; }
.eintrag-kopf { display: flex; justify-content: space-between; gap: 8px; color: var(--leise); font-size: 15px; }
.eintrag-werte { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 4px; }
.eintrag-werte span b { font-size: 20px; }
button.eintrag { display: block; width: 100%; text-align: left; border: 2px solid transparent; }
button.eintrag:active { border-color: var(--linie); }
.eintrag .geaendert { font-size: 12px; border: 1px solid var(--linie); border-radius: 6px; padding: 0 6px; margin-left: 6px; color: var(--leise); }
.eintrag .mini { width: 96px; height: 72px; border-radius: 10px; object-fit: cover; display: block; margin-top: 8px; }
.tag-kopf { color: var(--leise); font-size: 15px; font-weight: 700; margin: 18px 0 8px; }
.tag-kopf:first-of-type { margin-top: 4px; }
.kurve { background: var(--flaeche); border-radius: 16px; padding: 12px 14px 8px; margin-bottom: 14px; }
.kurve .klein { display: flex; justify-content: space-between; color: var(--leise); font-size: 14px; }
.seit { background: var(--flaeche2); border-radius: 10px; padding: 8px 12px; margin-top: 10px; }
.seit small { display: block; color: var(--leise); font-size: 13px; }
.seit b { font-size: 17px; }
.empf { margin: 10px 0 0; font-size: 16px; line-height: 1.4; }
.empf.ruhig { color: var(--leise); }
.runde-punkte { display: flex; gap: 6px; margin: 0 0 14px; }
.runde-punkte span { flex: 1; height: 6px; border-radius: 3px; background: var(--flaeche2); }
.runde-punkte span.an { background: var(--akzent); }
.frage-knopf { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 15px; border: 2px solid var(--linie); color: var(--leise); font-size: 16px; font-weight: 700; vertical-align: middle; margin-left: 6px; position: relative; }
.frage-knopf::after { content: ""; position: absolute; inset: -8px; }
.blatt-hg { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
.blatt { background: var(--bg); width: 100%; max-width: 560px; border-radius: 20px 20px 0 0; padding: 20px 18px calc(20px + env(safe-area-inset-bottom, 0px)); }
.blatt h2 { margin: 0 0 8px; }
.blatt p { font-size: 17px; line-height: 1.45; margin: 0 0 16px; }
.problem-teil { background: var(--flaeche); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; }
.problem-teil h3 { margin: 0 0 6px; font-size: 17px; }
.problem-teil p, .problem-teil li { font-size: 16px; line-height: 1.45; }
.problem-teil p { margin: 0; }
.problem-teil ul { margin: 0; padding-left: 20px; }
.naehr { background: var(--flaeche); border-radius: 16px; padding: 12px 16px 6px; margin-bottom: 16px; }
.naehr-zeile { display: grid; grid-template-columns: 34px 1fr 78px; align-items: center; gap: 10px; min-height: 40px; }
.naehr-zeile .el { font-weight: 700; font-size: 17px; }
.naehr-zeile .wert { text-align: right; font-size: 17px; font-weight: 700; }
.naehr-zeile .wert small { display: block; font-size: 12px; font-weight: 400; color: var(--leise); }
.balken2 { position: relative; height: 10px; border-radius: 5px; background: var(--flaeche2); }
.balken2 .band { position: absolute; top: 0; bottom: 0; border-radius: 5px; background: var(--gut); opacity: .45; }
.balken2 .punkt { position: absolute; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 8px; background: var(--gut); border: 2px solid var(--bg); }
.balken2 .punkt.daneben { background: var(--akzent); }
.naehr .fuss { font-size: 14px; color: var(--leise); margin: 6px 0 8px; }
.dazu { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin: 4px 0 8px; }
.dazu div { background: var(--flaeche2); border-radius: 10px; padding: 6px 2px; text-align: center; }
.dazu small { display: block; color: var(--leise); font-size: 13px; font-weight: 700; }
.dazu b { font-size: 17px; }
.logo-gross { display: block; width: min(100%, 320px); height: auto; margin: 4px auto 18px; }
.logo-klein { display: block; height: 64px; width: auto; margin: 0 0 6px -4px; }
.karte-eintragen { position: absolute; left: 14px; bottom: 14px; min-height: 46px; padding: 0 16px; border-radius: 13px; background: transparent; border: 2px solid var(--linie); color: var(--text); font-size: 16px; }
.eintrag .loeschen { color: var(--leise); font-size: 14px; text-decoration: underline; padding: 6px 0 0; }
.filter { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 14px; }
.filter button { min-height: 44px; padding: 0 16px; border-radius: 22px; background: var(--flaeche); white-space: nowrap; font-size: 16px; }
.filter button[aria-pressed="true"] { background: var(--akzent); color: var(--akzent-text); font-weight: 700; }

.schalter { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; background: var(--flaeche); border-radius: 14px; padding: 12px 16px; margin-bottom: 8px; min-height: 60px; }
.schalter .pille { flex: none; width: 56px; height: 32px; border-radius: 16px; background: var(--flaeche2); position: relative; border: 2px solid var(--linie); }
.schalter .pille::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 11px; background: var(--leise); transition: left .15s; }
.schalter[aria-checked="true"] .pille { background: var(--gut); border-color: var(--gut); }
.schalter[aria-checked="true"] .pille::after { left: 27px; background: var(--bg); }
.schalter small { display: block; color: var(--leise); font-size: 14px; }

.zeile-knopf { width: 100%; min-height: 56px; border-radius: 14px; background: var(--flaeche2); font-size: 18px; font-weight: 700; margin-bottom: 10px; }
.status { font-size: 15px; color: var(--leise); margin-bottom: 12px; }
.status::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 5px; background: var(--leise); margin-right: 8px; }
.status.gut::before { background: var(--gut); }

.toast { position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--gut); color: var(--bg); font-weight: 700; padding: 12px 20px; border-radius: 24px; opacity: 0; pointer-events: none; transition: opacity .2s; display: flex; align-items: center; gap: 16px; width: max-content; max-width: calc(100% - 32px); z-index: 20; }
.toast.an { opacity: 1; }
.toast.an.mit { pointer-events: auto; padding: 4px 8px 4px 20px; }
.toast button { color: var(--bg); font-weight: 700; font-size: 16px; text-decoration: underline; min-height: 44px; padding: 0 8px; }
.tuer { display: block; width: 100%; text-align: left; background: var(--flaeche); border: 2px solid var(--linie); border-radius: 18px; padding: 18px; margin-bottom: 14px; min-height: 96px; }
.tuer b { display: block; font-size: 21px; margin-bottom: 4px; }
.tuer span { color: var(--leise); font-size: 16px; }
.tuer.haupt { background: var(--akzent); border-color: var(--akzent); color: var(--akzent-text); }
.tuer.haupt span { color: var(--akzent-text); opacity: .9; }
.liste { background: var(--flaeche); border-radius: 18px; overflow: hidden; margin-bottom: 14px; }
.listen-zeile { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; padding: 14px 18px; min-height: 72px; border-bottom: 1px solid var(--linie); }
.listen-zeile:last-child { border-bottom: 0; }
.listen-zeile b { display: block; font-size: 19px; }
.listen-zeile small { display: block; color: var(--leise); font-size: 15px; margin-top: 2px; }
.listen-zeile .pfeil { color: var(--leiser); font-size: 24px; }
.wert-zeile { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--flaeche); border-radius: 14px; padding: 10px 16px; min-height: 52px; margin-bottom: 12px; font-size: 16px; }
.wert-zeile .aendern-text { color: var(--akzent); font-weight: 700; flex: none; }
.zeile-knopf.leise-knopf { background: transparent; border: 2px solid var(--linie); color: var(--leise); font-weight: 400; }
.wert-panel { border: 2px solid var(--linie); border-radius: 16px; padding: 14px; margin: -4px 0 16px; }
.orte { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 18px; }
.orte button, .sym { min-height: 56px; border-radius: 14px; background: var(--flaeche); padding: 10px 14px; text-align: left; font-size: 17px; border: 2px solid transparent; }
.orte button[aria-pressed="true"], .sym[aria-pressed="true"] { border-color: var(--akzent); background: var(--flaeche2); }
.sym { display: flex; gap: 12px; align-items: center; width: 100%; margin-bottom: 8px; }
.sym .box { flex: none; width: 26px; height: 26px; border-radius: 7px; border: 2px solid var(--linie); display: grid; place-items: center; font-weight: 700; font-size: 16px; }
.sym[aria-pressed="true"] .box { background: var(--akzent); border-color: var(--akzent); color: var(--akzent-text); }
.befund { background: var(--flaeche); border-radius: 18px; padding: 16px 18px; margin-bottom: 14px; }
.befund h3 { font-size: 21px; margin: 0 0 4px; }
.befund .stufe { font-size: 15px; color: var(--akzent); font-weight: 700; margin-bottom: 8px; }
.befund .stufe.moeglich { color: var(--leise); }
.befund p { font-size: 16px; }
.befund ul { margin: 0 0 8px; padding-left: 20px; font-size: 16px; }
.befund li { margin-bottom: 6px; }
.befund .passt { border-left: 3px solid var(--gut); padding-left: 10px; margin: 8px 0 10px; font-size: 16px; }
.regler-zeile { width: 100%; text-align: left; background: var(--flaeche); border-radius: 14px; padding: 14px 18px; margin-bottom: 14px; min-height: 60px; display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 18px; }
.regler-zeile span.pfeil { color: var(--leiser); }
.zeile-knopf.doktor { background: var(--flaeche); border: 2px solid var(--linie); margin: 0 0 8px; }
.kalender { background: var(--flaeche); border-radius: 18px; padding: 16px 18px; margin: 0 0 14px; }
.kalender .ernte { font-size: 30px; font-weight: 700; color: var(--akzent); line-height: 1.15; }
.kalender .tag { font-size: 17px; margin: 2px 0 10px; }
.balken { height: 10px; border-radius: 5px; background: var(--flaeche2); overflow: hidden; margin: 6px 0 10px; }
.balken div { height: 100%; background: var(--gut); border-radius: 5px; }
.kalender .klein { font-size: 15px; color: var(--leise); }
.kalender .aendern { color: var(--leise); text-decoration: underline; font-size: 15px; padding: 8px 0 0; }
.kalender .vorschlag { border-top: 1px solid var(--linie); margin-top: 12px; padding-top: 12px; font-size: 16px; }
.kalender .vorschlag button { margin-top: 10px; min-height: 48px; padding: 0 18px; border-radius: 12px; background: var(--akzent); color: var(--akzent-text); font-weight: 700; font-size: 16px; }
input[type="date"] { width: 100%; min-height: 60px; border-radius: 14px; border: 2px solid var(--linie); background: var(--flaeche); color: var(--text); font: inherit; font-size: 22px; padding: 8px 16px; }
.stift { width: 48px; height: 48px; border-radius: 24px; background: var(--flaeche); font-size: 20px; flex: none; margin-left: auto; }
.namen-form { display: flex; gap: 8px; margin: 0 0 18px; }
.namen-form input { flex: 1; font-size: 22px; }
.namen-form button { flex: none; min-height: 60px; padding: 0 18px; border-radius: 14px; background: var(--akzent); color: var(--akzent-text); font-weight: 700; }
.sym svg { flex: none; border-radius: 8px; background: rgba(255,255,255,.04); }
.orte button:last-child:nth-child(odd) { grid-column: span 2; }
.frage { background: var(--flaeche2); border: 2px solid var(--akzent); border-radius: 18px; padding: 16px 18px; margin: 0 0 16px; }
.frage b { display: block; font-size: 19px; margin-bottom: 10px; }
.frage button { display: block; width: 100%; text-align: left; min-height: 52px; border-radius: 12px; background: var(--flaeche); padding: 10px 14px; margin-bottom: 8px; font-size: 17px; }
.kontrolle { background: var(--flaeche2); border: 2px solid var(--akzent); border-radius: 18px; padding: 16px 18px; margin: 0 0 14px; }
.kontrolle p { margin: 0 0 12px; }
.kontrolle .reihe { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.kontrolle .reihe button { min-height: 52px; border-radius: 12px; background: var(--flaeche); font-weight: 700; font-size: 16px; }
.kontrolle .spaeter { margin-top: 8px; color: var(--leise); font-size: 15px; text-decoration: underline; padding: 6px 0; }
.badge { display: inline-block; margin-top: 8px; background: var(--akzent); color: var(--akzent-text); font-weight: 700; font-size: 14px; border-radius: 10px; padding: 3px 10px; }
.versucht { font-size: 14px; color: var(--leise); font-weight: 400; }
.karte { position: relative; margin-bottom: 14px; }
.karte .eimer { margin-bottom: 0; padding: 18px 56px 18px 18px; }
.karte.mit-knopf .eimer { padding-bottom: 70px; }
.eimer-oben > div:first-child { min-width: 0; }
.klapp { position: absolute; top: 10px; right: 8px; width: 44px; height: 44px; border-radius: 22px; color: var(--leiser); font-size: 18px; }
.karte-topup { position: absolute; right: 14px; bottom: 14px; min-height: 46px; padding: 0 20px; border-radius: 13px; background: var(--akzent); color: var(--akzent-text); font-weight: 700; font-size: 17px; }
.hoch { color: var(--fehler); }
.tief { color: #86A8BF; }
.ec-gross.leer { color: var(--leiser); }
.karte-zeile2 { color: var(--leiser); font-size: 15px; margin-top: 2px; }
.ernte-wichtig { display: inline-block; margin-top: 8px; background: var(--flaeche2); border: 1px solid var(--akzent); color: var(--akzent); font-weight: 700; font-size: 13px; border-radius: 10px; padding: 4px 10px; line-height: 1.3; }
.eimer-zu { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; background: var(--flaeche); border-radius: 14px; padding: 12px 16px; margin-bottom: 10px; min-height: 56px; }
.eimer-zu .eimer-name { font-size: 18px; }
.eimer-zu .rechts { display: flex; align-items: center; gap: 12px; color: var(--leise); font-size: 15px; }
.eimer-zu .rechts b { color: var(--akzent); font-size: 18px; }
.eimer-zu .rechts b.hoch { color: var(--fehler); }
.eimer-zu .rechts b.tief { color: #86A8BF; }
.setup-kopf { color: var(--leise); font-size: 15px; margin-bottom: 6px; }
.setup h1 { margin-bottom: 8px; }

<script>
// Hydro-Assistent – Rechenkern (Stufe 2)
// Kette: Füllhöhe -> Liter -> Säure -> Soll minus Wasser -> Solver -> EC-Schätzung -> Mischanleitung
(function (root) {
  const MAKRO = ['N', 'P', 'K', 'Ca', 'Mg', 'S'];
  const SPUREN = ['Fe', 'Mn', 'Zn', 'Cu', 'B', 'Mo'];
  const GEWICHT = { N: 3, P: 1, K: 3, Ca: 3, Mg: 1.5, S: 0.5 };
  const UEBERSCHUSS_MILD = { P: true, S: true, Ca: true, Mg: true }; // Überschuss halb so schlimm wie Mangel
  const NH4_MAX = 0.15;
  const FE_MAX = 3; // mg/L
  const GRENZE = { N: 250, P: 100, K: 400, Ca: 250, Mg: 100, S: 999 }; // mg/L, ab hier Hinweis 'hoch'
  const MOLMASSE = { K: 39.098, Ca: 40.078, Mg: 24.305, N: 14.007, P: 30.974, S: 32.06 };

  // ---------- 1. Füllhöhe -> Liter ----------
  function liter(eimer, h) {
    if (h <= 0) return 0;
    if (eimer.form === 'rechteck') return eimer.laenge * eimer.breite * h / 1000;
    if (eimer.form === 'rund') return Math.PI * (eimer.durchmesser / 2) ** 2 * h / 1000;
    if (eimer.form === 'konisch') {
      const r1 = eimer.dUnten / 2;
      const r2 = r1 + (eimer.dOben / 2 - r1) * h / eimer.hoehe; // Radius auf Füllhöhe
      return Math.PI * h / 3 * (r1 * r1 + r1 * r2 + r2 * r2) / 1000;
    }
    if (eimer.form === 'tabelle') { // [[cm, L], ...] aufsteigend, linear dazwischen
      const t = eimer.tabelle;
      if (h <= t[0][0]) return t[0][1] * h / t[0][0];
      for (let i = 1; i < t.length; i++) if (h <= t[i][0]) {
        const [h0, l0] = t[i - 1], [h1, l1] = t[i];
        return l0 + (l1 - l0) * (h - h0) / (h1 - h0);
      }
      return t[t.length - 1][1];
    }
    throw new Error('Unbekannte Eimerform: ' + eimer.form);
  }

  // ---------- 2. Säure ----------
  const DICHTE_H2SO4 = [[0, 0.998], [10, 1.066], [20, 1.139], [30, 1.218], [37, 1.277], [40, 1.303], [50, 1.395], [60, 1.498], [70, 1.610], [80, 1.727], [90, 1.814], [96, 1.835]];
  function dichteH2SO4(konz) {
    for (let i = 1; i < DICHTE_H2SO4.length; i++) if (konz <= DICHTE_H2SO4[i][0]) {
      const [c0, d0] = DICHTE_H2SO4[i - 1], [c1, d1] = DICHTE_H2SO4[i];
      return d0 + (d1 - d0) * (Math.max(konz, c0) - c0) / (c1 - c0);
    }
    return DICHTE_H2SO4[DICHTE_H2SO4.length - 1][1];
  }
  const DICHTE_HNO3 = [[0, 0.998], [3, 1.015], [10, 1.054], [20, 1.115], [30, 1.180], [38, 1.235], [53, 1.330], [65, 1.391]];
  function dichteHNO3(konz) {
    for (let i = 1; i < DICHTE_HNO3.length; i++) if (konz <= DICHTE_HNO3[i][0]) {
      const [c0, d0] = DICHTE_HNO3[i - 1], [c1, d1] = DICHTE_HNO3[i];
      return d0 + (d1 - d0) * (Math.max(konz, c0) - c0) / (c1 - c0);
    }
    return DICHTE_HNO3[DICHTE_HNO3.length - 1][1];
  }
  // Liefert mmol Säure pro Liter und was sie an P bzw. N mitbringt
  // H+ pro mol Carbonat bis zum Ziel-pH (CO3 -> HCO3 -> teils CO2)
  const hProCO3 = pH => 1 + (1 - 1 / (1 + 10 ** (6.35 - pH)));
  // Wasserglas: was 1 ml bringt
  function wasserglasProMl(wg) {
    const g = wg.dichte * 1000 / 1000; // g pro ml
    const K = g * wg.K2O / 100 * 2 * 39.098 / 94.196 * 1000;       // mg K
    const Si = g * wg.SiO2 / 100 * 28.086 / 60.084 * 1000;         // mg Si
    return { K, Si, hBedarf: K / 39.098 };                          // mmol H+ (1 pro K)
  }
  function saeure(wasser, s, kal, extraH) {
    const pH = s.zielPH;
    const hBedarf = wasser.alkalitaet * (1 - 1 / (1 + 10 ** (6.35 - pH))) * kal.saeureFaktor + (extraH || 0); // mmol H+/L
    if (s.typ === 'phosphor') {
      const hProMol = 1 + 1 / (1 + 10 ** (7.2 - pH));
      const mmol = hBedarf / hProMol;
      const dichte = s.konz >= 80 ? 1.685 : 1.579; // 85 % bzw. 75 %
      const mmolProMl = dichte * (s.konz / 100) / 97.994 * 1000;
      return { mmol, P: mmol * MOLMASSE.P, N: 0, mmolProMl, name: `Phosphorsäure ${s.konz} %` };
    }
    if (s.typ === 'salpeter') {
      const mmol = hBedarf;
      const mmolProMl = dichteHNO3(s.konz) * (s.konz / 100) / 63.01 * 1000;
      return { mmol, P: 0, N: mmol * MOLMASSE.N, mmolProMl, name: `Salpetersäure ${s.konz} %` };
    }
    if (s.typ === 'schwefel') {
      // Beim Ziel-pH gibt Schwefelsäure beide H+ ab, bringt Schwefel statt Phosphor oder Stickstoff
      const mmol = hBedarf / 2;
      const mmolProMl = dichteH2SO4(s.konz) * (s.konz / 100) / 98.079 * 1000;
      return { mmol, P: 0, N: 0, S: mmol * MOLMASSE.S, mmolProMl, name: `Schwefelsäure ${s.konz} %`, ecFaktor: kal.ecProMmolSchwefel / kal.ecProMmolSaeure };
    }
    return { mmol: 0, P: 0, N: 0, mmolProMl: 1, name: 'keine Säure' };
  }

  // ---------- 3. EC-Schätzung ----------
  // Zusätzliche Kationen (meq/L) / 10, mal Kalibrierfaktor, plus Beitrag der Säure
  function ecSchaetzung(zugabe, ecWasser, saeureMmol, kal) {
    const meq = zugabe.K / MOLMASSE.K + 2 * zugabe.Ca / MOLMASSE.Ca + 2 * zugabe.Mg / MOLMASSE.Mg + zugabe.NH4 / MOLMASSE.N;
    const ecSalz = kal.ecSalzFaktor * meq / 10;
    const ecSaeure = kal.ecProMmolSaeure * saeureMmol;
    return { gesamt: ecWasser + ecSalz + ecSaeure, salz: ecSalz, saeure: ecSaeure, vorSaeure: ecWasser + ecSalz };
  }

  // Was die Salzmengen x (g/L) an mg/L bringen
  function zugabe(salze, x) {
    const z = { NO3: 0, NH4: 0, P: 0, K: 0, Ca: 0, Mg: 0, S: 0, Fe: 0, Mn: 0, Zn: 0, Cu: 0, B: 0, Mo: 0 };
    salze.forEach((s, j) => { for (const e in z) z[e] += (s[e] || 0) * 10 * x[j]; });
    z.N = z.NO3 + z.NH4;
    return z;
  }

  // ---------- 4. Solver ----------
  // Minimiert gewichtete relative Abweichung vom Soll, x >= 0,
  // Strafterme für Ammonium > 15 % und Eisen unter Minimum. Koordinatenabstieg (Problem ist konvex).
  function solver(salze, soll, basis, feMin, start, schnell) {
    const n = salze.length;
    const x = start ? start.slice() : new Array(n).fill(0.1);
    function ziel(xx) {
      const z = zugabe(salze, xx);
      let f = 0;
      for (const e of MAKRO) {
        if (soll[e] <= 0) continue;
        const ist = basis[e] + z[e];
        let d = (ist - soll[e]) / soll[e];
        if (d > 0 && UEBERSCHUSS_MILD[e]) d *= 0.5;
        f += GEWICHT[e] * d * d;
      }
      // Sparsamkeit: unter sonst gleichen Ergebnissen die kleinere Menge, sonst laufen Salze ohne Makro-Wirkung (z. B. Spurenmix) davon
      for (let j = 0; j < xx.length; j++) f += 1e-3 * xx[j] * xx[j];
      const nGes = z.N + basis.N;
      const nh4Zuviel = Math.max(0, z.NH4 + basis.NH4 - NH4_MAX * nGes);
      f += 1000 * (nh4Zuviel / Math.max(soll.N, 1)) ** 2;
      if (feMin > 0) f += 1000 * (Math.max(0, feMin - z.Fe - basis.Fe) / feMin) ** 2;
      f += 100 * (Math.max(0, z.Fe + basis.Fe - FE_MAX) / FE_MAX) ** 2; // zu viel Eisen ist auch nicht gut
      return f;
    }
    const GOLD = (Math.sqrt(5) - 1) / 2;
    for (let runde = 0; runde < (schnell ? 40 : 140); runde++) {
      let maxSchritt = 0;
      for (let j = 0; j < n; j++) {
        let a = 0, b = Math.min(60, Math.max(3, (x[j] || 0) * 2));
        const f = t => { const alt = x[j]; x[j] = t; const v = ziel(x); x[j] = alt; return v; };
        let c = b - GOLD * (b - a), d = a + GOLD * (b - a), fc = f(c), fd = f(d);
        for (let i = 0; i < (schnell ? 25 : 40); i++) {
          if (fc < fd) { b = d; d = c; fd = fc; c = b - GOLD * (b - a); fc = f(c); }
          else { a = c; c = d; fc = fd; d = a + GOLD * (b - a); fd = f(d); }
        }
        let neu = (a + b) / 2;
        if (f(0) <= f(neu)) neu = 0;
        maxSchritt = Math.max(maxSchritt, Math.abs(neu - x[j]));
        x[j] = neu;
      }
      if (maxSchritt < (schnell ? 1e-4 : 1e-5)) break;
    }
    return x;
  }

  // ---------- 5. Rundung auf die Waage (0,01 g) ----------
  function runden(g) {
    if (g >= 10) return Math.round(g * 10) / 10;
    return Math.round(g * 100) / 100;
  }

  // ---------- 6. Ziel-EC ----------
  function zielEC(D, phase, typ, staerke, spar) {
    const p = D.phasen[phase];
    const band = typ === 'auto' ? p.ecAuto : p.ecPhoto;
    const mitte = (band[0] + band[1]) / 2;
    const deckel = typ === 'auto' && p.deckelAuto ? p.deckelAuto : p.deckel;
    let ec = Math.min(mitte * D.staerke[staerke], deckel);
    // Sparmodus: nur der Nährstoffanteil wird kleiner, das Leitungswasser bleibt wie es ist
    if (spar && D.spar && D.spar.phasen.includes(phase)) { const w = D.wasser.ecGemessen; ec = w + Math.max(0, ec - w) * D.spar.faktor; }
    return Math.round(ec * 100) / 100;
  }

  // ---------- 7. Rezept für ein Volumen und eine Ziel-EC ----------
  // opt: { phase, liter, ecZiel, vorrat: {salzId: false}, feMin }
  function rezept(D, opt) {
    const kal = D.kalibrierung, w = D.wasser;
    // Standard-Satz (aktiv), außer der Nutzer schaltet einzeln an/aus; vorrat[id] === false heißt 'nicht vorrätig'
    const salpeter = D.saeure.typ === 'salpeter';
    let salze = D.salze.filter(s => {
      if (s.nurMitSalpeter && !salpeter) return false;
      if (opt.vorrat && opt.vorrat[s.id] === false) return false;
      if (opt.auswahl && opt.auswahl[s.id] !== undefined) return opt.auswahl[s.id];
      return s.aktiv !== false;
    }).map(s => {
      if (!s.co3) return s;
      // Mit Salpetersäure wird aus K2CO3 praktisch Kaliumnitrat: N pro g aus der zusätzlichen Säure
      return Object.assign({}, s, { NO3: hProCO3(D.saeure.zielPH) * 14.007 / 138.205 * 100 });
    });
    const ph = D.phasen[opt.phase];
    const profil = opt.rezeptStudie && ph.profilStudie ? ph.profilStudie : ph.profil;
    // Wasserglas: K und Säurebedarf fest vorab, zählt wie Wasser zur Basis
    const wgDosis = opt.wasserglas > 0 && D.wasserglas ? opt.wasserglas : 0;
    const wg = wgDosis ? wasserglasProMl(D.wasserglas) : { K: 0, Si: 0, hBedarf: 0 };
    const sa = saeure(w, D.saeure, kal, wg.hBedarf * wgDosis);
    const basis = { N: w.NO3 + w.NH4 + sa.N, NH4: w.NH4, P: w.P + sa.P, K: w.K + wg.K * wgDosis, Ca: w.Ca, Mg: w.Mg, S: w.S + (sa.S || 0), Fe: 0 };
    // Wassereisen zählt nicht: fällt im Behälter größtenteils aus
    const feMin = opt.feMin !== undefined ? opt.feMin : Math.min(0.8, Math.max(0.25, 0.5 * (opt.ecZiel - w.ecGemessen)));
    const hinweise = [];

    const saBasis = saeure(w, D.saeure, kal); // nur Hydrogencarbonat, für den EC-Beitrag der Säure
    // Faktor k so suchen, dass die geschätzte EC die Ziel-EC trifft
    function loese(liste, schnell) {
      let lo = 0.05, hi = 2.5, x = null, k = 1, ec = null, z = null;
      for (let i = 0; i < (schnell ? 12 : 22); i++) {
        k = (lo + hi) / 2;
        const soll = {}; for (const e of MAKRO) soll[e] = profil[e] * k;
        x = solver(liste, soll, basis, feMin, x, schnell);
        z = zugabe(liste, x);
        ec = ecSchaetzung(Object.assign({}, z, { K: z.K + wg.K * wgDosis }), w.ecGemessen, saBasis.mmol * (saBasis.ecFaktor || 1), kal);
        if (ec.gesamt > opt.ecZiel) hi = k; else lo = k;
      }
      const soll = {}; for (const e of MAKRO) soll[e] = profil[e] * k;
      let f = 0; for (const e of MAKRO) { let d = ((basis[e] + z[e]) - soll[e]) / soll[e]; if (d > 0 && UEBERSCHUSS_MILD[e]) d *= 0.5; f += GEWICHT[e] * d * d; }
      // Formgüte: Vergleich der Anteile statt der Absolutwerte. Nur so sind Kandidaten
      // vergleichbar, deren Lösung bei unterschiedlichem k landet.
      let sIst = 0, sSoll = 0;
      for (const e of MAKRO) { sIst += basis[e] + z[e]; sSoll += profil[e]; }
      let form = 0;
      for (const e of MAKRO) {
        const p = (basis[e] + z[e]) / sIst, q = profil[e] / sSoll;
        form += GEWICHT[e] * (p - q) * (p - q) / q;
      }
      return { x, k, ec, z, soll, guete: f, form };
    }

    // Aus mehreren Volldüngern derselben Gruppe den für diese Phase passenden wählen
    const gruppen = {};
    salze.forEach(s => { if (s.gruppe) (gruppen[s.gruppe] = gruppen[s.gruppe] || []).push(s); });
    for (const g in gruppen) {
      if (gruppen[g].length < 2) continue;
      const andere = salze.filter(s => s.gruppe !== g);
      let bester = null;
      gruppen[g].forEach(s => {
        const r = loese(andere.concat([s]), true);
        if (!bester || r.form < bester.form - 1e-9) bester = { guete: r.guete, form: r.form, s };
      });
      // Ein zweiter Volldünger kommt nur dazu, wenn er das Ergebnis deutlich verbessert
      let zweiter = null, besteGuete = bester.form;
      gruppen[g].forEach(s => {
        if (s === bester.s) return;
        const r = loese(andere.concat([bester.s, s]), true);
        if (r.form < besteGuete * 0.9) { besteGuete = r.form; zweiter = s; }
      });
      const genommen = zweiter ? [bester.s, zweiter] : [bester.s];
      const raus = gruppen[g].filter(s => !genommen.includes(s));
      salze = andere.concat(genommen).sort((a, b) => D.salze.indexOf(a) - D.salze.indexOf(b));
      hinweise.push(`Von deinen Volldüngern passt ${genommen.map(s => s.name).join(' zusammen mit ')} hier am besten.` +
        (raus.length ? ` ${raus.map(s => s.name).join(' und ')} ${raus.length > 1 ? 'werden' : 'wird'} in dieser Phase nicht eingeplant.` : ''));
    }

    const erg = loese(salze, false);
    const x = erg.x, k = erg.k, ec = erg.ec, z = erg.z, soll = erg.soll;

    // Wenn schon ohne Salze über dem Ziel
    const ecOhneSalz = w.ecGemessen + kal.ecProMmolSaeure * saBasis.mmol * (saBasis.ecFaktor || 1) + kal.ecSalzFaktor * wg.K * wgDosis / 39.098 / 10;
    if (ecOhneSalz >= opt.ecZiel) hinweise.push(`Wasser und Säure ergeben schon EC ${ecOhneSalz.toFixed(2)} – Ziel ${opt.ecZiel.toFixed(2)} ist damit nicht erreichbar.`);
    else if (opt.ecZiel - ecOhneSalz < 0.35) hinweise.push(`Von der Ziel-EC ${opt.ecZiel.toFixed(2)} bleiben nach Leitungswasser und Säure nur ${(opt.ecZiel - ecOhneSalz).toFixed(2)} für Nährstoffe. Die Lösung wird dünn, Stickstoff und Eisen bleiben knapp. Besser: eine höhere Ziel-EC fahren (Stärke hochstellen), weniger stark ansäuern oder mit Regen- oder Osmosewasser mischen.`);

    const ist = {};
    for (const e of MAKRO) ist[e] = basis[e] + z[e];
    ist.NH4anteil = (z.NH4 + basis.NH4) / ist.N;
    for (const e of SPUREN) ist[e] = z[e];
    ist.Si = wg.Si * wgDosis;

    for (const e of MAKRO) {
      const abw = (ist[e] - soll[e]) / soll[e];
      const wasserAnteil = e === 'Ca' ? w.Ca : e === 'Mg' ? w.Mg : e === 'S' ? w.S : 0;
      if (wasserAnteil >= soll[e]) hinweise.push(`${e}: Das Wasser deckt den Bedarf schon (${wasserAnteil.toFixed(0)} mg/L im Wasser, Soll ${soll[e].toFixed(0)}).`);
      // Zu viel meldet die App nur, wenn der Wert auch absolut hoch ist (das Soll ist bewusst knapp angesetzt)
      else if (abw > 0.3 && ist[e] > GRENZE[e]) hinweise.push(`${e} liegt bei ${ist[e].toFixed(0)} mg/L, das ist hoch (${(abw * 100).toFixed(0)} % über Soll)` + (e === 'P' && sa.P > 0 ? `. ${sa.P.toFixed(0)} mg/L davon bringt die Phosphorsäure.` : '.'));
      else if (abw < -0.15) hinweise.push(`${e} liegt ${(-abw * 100).toFixed(0)} % unter Soll – mit den vorrätigen Salzen nicht besser erreichbar.`);
    }
    const ersatzK = salze.some(s => s.co3);
    const fehlend = D.salze.filter(s => opt.vorrat && opt.vorrat[s.id] === false && s.aktiv !== false && !(s.nurMitSalpeter && !salpeter))
      .filter(s => !(s.id === 'kno3' && ersatzK)).map(s => s.name);
    if (fehlend.length) {
      // nur die Elemente ansehen, die das fehlende Salz überhaupt liefern würde
      const fehlendeSalze = D.salze.filter(s => opt.vorrat && opt.vorrat[s.id] === false && s.aktiv !== false && !(s.nurMitSalpeter && !salpeter));
      const liefert = e => fehlendeSalze.some(s => (e === 'N' ? (s.NO3 || 0) + (s.NH4 || 0) : (s[e] || 0)) > 0.5);
      let schlimmstes = null, abwMin = 0;
      for (const e of ['N', 'P', 'K', 'Ca', 'Mg']) { if (!liefert(e)) continue; const a = (ist[e] - soll[e]) / soll[e]; if (a < abwMin) { abwMin = a; schlimmstes = e; } }
      hinweise.push(`Nicht vorrätig: ${fehlend.join(', ')}.` + (schlimmstes ? ` Dadurch fehlt vor allem ${schlimmstes} (${(abwMin * 100).toFixed(0)} % gegenüber dem Verhältnis).` : ''));
    }
    if (D.saeure.typ === 'schwefel') hinweise.push('Mit Schwefelsäure ist die EC-Schätzung noch nicht an echten Mischungen geprüft. Miss nach und trag die Werte ein.');
    if (ist.NH4anteil > NH4_MAX + 0.01) hinweise.push(`Ammonium-Anteil ${(ist.NH4anteil * 100).toFixed(0)} % (Ziel höchstens 15 %).`);
    if (ist.Fe < 0.5) hinweise.push(`Eisen nur ${ist.Fe.toFixed(2)} mg/L – eher knapp.`);
    if (ist.Fe > 3) hinweise.push(`Eisen ${ist.Fe.toFixed(1)} mg/L – über 3 mg/L.`);
    if (Math.abs(ec.gesamt - opt.ecZiel) > 0.15) hinweise.push(`Geschätzte EC ${ec.gesamt.toFixed(2)} weicht mehr als 0,15 vom Ziel ab.`);

    // Winzige Mengen (unter 0,2 g bei einem vollen Ansatz) weglassen und ohne dieses Salz neu rechnen
    if (!opt.ohneWinzig) {
      const winzig = salze.filter((s, j) => x[j] * opt.liter > 0.005 && x[j] * opt.liter < 0.25 && !s.co3 && !s.loesungGProL);
      if (winzig.length) {
        const auswahl = Object.assign({}, opt.auswahl);
        winzig.forEach(s => auswahl[s.id] = false);
        const r2 = rezept(D, Object.assign({}, opt, { auswahl, ohneWinzig: true }));
        const guete = r => MAKRO.reduce((f, e) => f + GEWICHT[e] * ((r.ist[e] - r.soll[e]) / r.soll[e]) ** 2, 0);
        const r1guete = MAKRO.reduce((f, e) => f + GEWICHT[e] * (((basis[e] + z[e]) - soll[e]) / soll[e]) ** 2, 0);
        if (guete(r2) <= r1guete * 1.15 + 0.01) return r2; // kaum schlechter -> einfacher Ansatz gewinnt
      }
    }

    // Gramm für das Volumen
    const mengen = [];
    let extraMmolH = 0; // Säure für das Carbonat, gesamt für das Volumen
    const reihe = D.reihenfolge;
    salze.map((s, j) => ({ s, gL: x[j] }))
      .filter(m => m.gL * opt.liter >= 0.005)
      .sort((a, b) => reihe.indexOf(a.s.id) - reihe.indexOf(b.s.id))
      .forEach(m => {
        const g = m.gL * opt.liter;
        const gr = runden(g);
        const eintrag = { id: m.s.id, name: m.s.name, gProL: m.gL, gramm: gr };
        if (m.s.loesungGProL) eintrag.ml = Math.round(g / m.s.loesungGProL * 1000 * 10) / 10;
        if (m.s.co3) extraMmolH += g / 138.205 * 1000 * hProCO3(D.saeure.zielPH);
        mengen.push(eintrag);
        if (g < 0.3 && !m.s.loesungGProL) hinweise.push(`${m.s.name}: nur ${gr.toFixed(2)} g – kleine Menge, Waage ist hier ungenau.`);
      });
    const hProSaeure = D.saeure.typ === 'phosphor' ? 1 + 1 / (1 + 10 ** (7.2 - D.saeure.zielPH)) : D.saeure.typ === 'schwefel' ? 2 : 1;
    const saeureMl = (sa.mmol * opt.liter + extraMmolH / hProSaeure) / sa.mmolProMl;

    return {
      liter: opt.liter, ecZiel: opt.ecZiel, faktorK: k,
      mengen,
      wasserglasMl: wgDosis ? Math.round(wgDosis * opt.liter * 10) / 10 : 0,
      saeure: { name: sa.name, ml: Math.round(saeureMl * 10) / 10, zuerstMl: Math.round(saeureMl * 0.75 * 10) / 10 },
      ec: { vorSaeure: ec.vorSaeure, gesamt: ec.gesamt, saeure: ec.gesamt - ec.vorSaeure },
      soll, ist, hinweise,
    };
  }

  // ---------- 8. Vollansatz (Fall C) ----------
  function vollansatz(D, opt) { // opt: { phase, typ, staerke, fuellhoehe, vorrat }
    const h = Math.min(opt.fuellhoehe, D.eimer.maxFuell);
    const r = rezept(D, { phase: opt.phase, liter: liter(D.eimer, h), ecZiel: zielEC(D, opt.phase, opt.typ, opt.staerke, opt.spar), vorrat: opt.vorrat, auswahl: opt.auswahl, wasserglas: opt.wasserglas, rezeptStudie: opt.rezeptStudie });
    if (opt.fuellhoehe > D.eimer.maxFuell) r.hinweise.unshift(`Füllhöhe auf ${D.eimer.maxFuell} cm begrenzt – Luftspalt unter dem Netztopf.`);
    r.fuellhoehe = h;
    return r;
  }

  // ---------- 9. TOP-UP (Fall A und B) ----------
  // opt: { phase, typ, staerke, hJetzt, ecJetzt, hZiel?, vorrat }
  function topUp(D, opt) {
    const hZielRoh = opt.hZiel !== undefined ? opt.hZiel : D.eimer.zielFuell;
    const hZiel = Math.min(hZielRoh, D.eimer.maxFuell);
    const vJetzt = liter(D.eimer, opt.hJetzt), vZiel = liter(D.eimer, hZiel);
    const fehlt = vZiel - vJetzt;
    const ecZiel = zielEC(D, opt.phase, opt.typ, opt.staerke, opt.spar);
    const ecW = D.wasser.ecGemessen;
    const hinweise = [];
    if (hZielRoh > D.eimer.maxFuell) hinweise.push(`Ziel auf ${D.eimer.maxFuell} cm begrenzt – Luftspalt unter dem Netztopf.`);
    if (opt.hJetzt > D.eimer.maxFuell) hinweise.push(`Füllhöhe ${opt.hJetzt} cm liegt über der Obergrenze ${D.eimer.maxFuell} cm – Luftspalt zu klein.`);
    if (fehlt < 0.2) return { fall: '–', text: 'Tank ist voll genug, nichts nachfüllen.', liter: 0, hinweise, ecZiel };

    const ecNurWasser = (opt.ecJetzt * vJetzt + ecW * fehlt) / vZiel;
    if (ecNurWasser >= ecZiel - 0.05) {
      const wgDosis = opt.wasserglas > 0 && D.wasserglas ? opt.wasserglas : 0;
      const sa = saeure(D.wasser, D.saeure, D.kalibrierung, wgDosis ? wasserglasProMl(D.wasserglas).hBedarf * wgDosis : 0);
      return {
        fall: 'A', wasserglasMl: wgDosis ? Math.round(wgDosis * fehlt * 10) / 10 : 0, text: `Nur Wasser nachfüllen: ${fehlt.toFixed(1)} L. EC danach etwa ${ecNurWasser.toFixed(2)}.`,
        liter: fehlt, ecDanach: ecNurWasser, ecZiel,
        saeureMl: Math.round(sa.mmol * fehlt / sa.mmolProMl * 10) / 10, hinweise,
      };
    }
    let ecNachfuell = (ecZiel * vZiel - opt.ecJetzt * vJetzt) / fehlt;
    const obergrenze = Math.max(ecZiel * 1.5, ecZiel + 0.5);
    if (ecNachfuell > obergrenze) {
      hinweise.push(`Nötige Nachfüll-EC ${ecNachfuell.toFixed(2)} wäre zu stark – auf ${obergrenze.toFixed(2)} begrenzt, Ziel-EC wird nicht ganz erreicht. Besser bald Wechsel.`);
      ecNachfuell = obergrenze;
    }
    const r = rezept(D, { phase: opt.phase, liter: fehlt, ecZiel: ecNachfuell, vorrat: opt.vorrat, auswahl: opt.auswahl, wasserglas: opt.wasserglas, rezeptStudie: opt.rezeptStudie });
    const ecDanach = (opt.ecJetzt * vJetzt + ecNachfuell * fehlt) / vZiel;
    return {
      fall: 'B', text: `${fehlt.toFixed(1)} L Nährlösung mit EC ${ecNachfuell.toFixed(2)} nachfüllen. EC danach etwa ${ecDanach.toFixed(2)}.`,
      liter: fehlt, ecNachfuell, ecDanach, ecZiel, rezept: r, hinweise: hinweise.concat(r.hinweise),
    };
  }

  const KERN = { liter, saeure, wasserglasProMl, ecSchaetzung, zugabe, rezept, vollansatz, topUp, zielEC, runden };
  if (typeof module !== 'undefined') module.exports = KERN; else root.HydroKern = KERN;
})(this);

  function bild(id) { return BILD[id] ? `<svg viewBox="0 0 48 48" width="52" height="52" aria-hidden="true">${BILD[id]()}</svg>` : ''; }

  // Rückfragen: werden gestellt, wenn zwei der vorderen Ursachen nah beieinander liegen
  const FRAGEN = [
    { id: 'wo_beginnt', frage: 'Wo auf dem einzelnen Blatt fängt es an?', fuer: ['k_mangel', 'mg_mangel', 'n_mangel', 'fe_mangel', 'brand', 'ca_mangel'],

  // kontext: { ph, ec, ecZiel, tageSeitMessung, phase, saeure: 'phosphor'|'salpeter', kaliumQuelle: bool }
  function diagnose(wo, symptome, kontext, antworten) {
    const k = kontext || {}, ant = antworten || {};
    const phNied = k.ph != null && k.ph < 5.5, phHoch = k.ph != null && k.ph > 6.5, phLeicht = k.ph != null && k.ph > 6.2;
    const ecHoch = k.ec != null && k.ecZiel && k.ec > k.ecZiel + 0.3, ecNied = k.ec != null && k.ecZiel && k.ec < k.ecZiel - 0.3;
    const liste = URSACHEN.map(u => {
      let p = 0, gruende = [];
      const symTreffer = symptome.reduce((s, id) => s + (u.s[id] || 0), 0);
      p += symTreffer + (symTreffer > 0 || u.id === 'ph' ? (u.w[wo] || 0) : 0);
      // Eimerdaten einbeziehen
      if (u.id === 'ph') {
        if (phNied || phHoch) { p += 4 + (symptome.length ? 1 : 0); gruende.push(`Zuletzt gemessen: pH ${k.ph.toFixed(1).replace('.', ',')}, außerhalb von 5,5 bis 6,5.`); }
        else p = 0;
      }
      if (['mg_mangel', 'ca_mangel'].includes(u.id) && phNied && symTreffer) { p += 2; gruende.push('Der letzte pH war unter 5,5.'); }
      if (['p_mangel', 'spuren'].includes(u.id) && phHoch && symTreffer) { p += 2; gruende.push('Der letzte pH war über 6,5.'); }
      if (u.id === 'fe_mangel' && phLeicht && symTreffer) { p += 2; gruende.push('Der letzte pH war über 6,2, da wird Eisen knapp.'); }
      if (['brand', 'n_zuviel'].includes(u.id) && symTreffer) {
        if (ecHoch) { p += 3; gruende.push(`Die letzte EC (${k.ec.toFixed(2).replace('.', ',')}) lag deutlich über dem Ziel (${k.ecZiel.toFixed(2).replace('.', ',')}).`); }
        else if (ecNied) p -= 2;
      }
      if (['n_mangel', 'k_mangel', 'mg_mangel'].includes(u.id) && symTreffer) {
        if (ecNied) { p += 2; gruende.push(`Die letzte EC (${k.ec.toFixed(2).replace('.', ',')}) lag deutlich unter dem Ziel.`); }
        else if (ecHoch) p -= 1;
      }
      if (u.id === 'p_mangel' && k.saeure === 'phosphor' && symTreffer) { p -= 2; gruende.push('Mit Phosphorsäure ist eher zu viel als zu wenig Phosphor im Tank.'); }
      if (u.id === 'k_mangel' && k.kaliumQuelle === false && symTreffer) { p += 1; gruende.push('Gerade ist keine eigene Kaliumquelle eingeplant (weder Kaliumnitrat noch Kaliumcarbonat).'); }
      if (u.id === 'ca_mangel' && symTreffer && !phNied) p -= 1; // viel Ca im Leitungswasser
      if (u.id === 'botrytis' && symTreffer && (k.phase === 'bluete' || k.phase === 'reife')) { p += 1; gruende.push('Die Pflanze ist in der Blüte, da ist Knospenfäule die größte Gefahr.'); }
      // Antworten auf Rückfragen
      for (const f of FRAGEN) if (ant[f.id] != null && f.antworten[ant[f.id]]) p += f.antworten[ant[f.id]][1][u.id] || 0;
      const hinweis = u.id !== 'n_mangel' ? null : k.spuelen ? 'Du spülst gerade: Gelbe Blätter sind jetzt normal. Nichts tun.' : k.sparSpaet ? 'Sparmodus ist an: Gelbe untere Blätter sind jetzt normal. Die Pflanze holt sich das Futter aus den alten Blättern. Solange oben alles grün ist, nichts tun.' : k.phase === 'reife' ? u.reife : null;
      return { id: u.id, titel: u.titel, punkte: p, erkennen: u.erkennen, tun: u.tun, gruende, hinweis, tage: u.tage || 3, art: u.schaedling ? 'schaedling' : u.schimmel ? 'schimmel' : 'naehrstoff' };
    }).filter(x => x.punkte >= 3).sort((a, b) => b.punkte - a.punkte);
    const top = liste.slice(0, 3);
    if (top.length) {
      const max = top[0].punkte;
      top.forEach(x => x.stufe = x.punkte >= max - 1 ? 'wahrscheinlich' : 'möglich');
    }
    // Nächste Rückfrage: nur wenn die vorderen Ursachen nah beieinander liegen, höchstens zwei Fragen
    let frage = null;
    const beantwortet = Object.keys(ant).length;
    if (top.length >= 2 && beantwortet < 2 && top[0].punkte - top[1].punkte <= 2) {
      const ids = top.map(x => x.id);
      const [a, b] = ids;
      // Frage muss die beiden vorderen Ursachen wirklich unterscheiden
      const f = FRAGEN.find(f => ant[f.id] == null && f.fuer.includes(a) && f.fuer.includes(b) && f.antworten.some(([, p]) => (p[a] || 0) !== (p[b] || 0)));
      if (f) frage = { id: f.id, frage: f.frage, antworten: f.antworten.map(a => a[0]) };
    }
    const warnungen = [];
    const nurSchaedling = top.length && top.every(x => x.art !== 'naehrstoff');
    if (top.some(x => x.id === 'botrytis')) warnungen.push('Knospenfäule breitet sich in wenigen Tagen durch die ganze Blüte aus. Nicht abwarten.');
    if (nurSchaedling) { /* Messwerte spielen hier keine Rolle */ }
    else if (k.ph == null) warnungen.push('Für diesen Tank ist noch kein pH und keine EC eingetragen. Miss beides zuerst, das macht die Einschätzung deutlich sicherer.');
    else if (k.tageSeitMessung > 3) warnungen.push(`Die letzte Messung ist ${Math.round(k.tageSeitMessung)} Tage alt. Miss pH und EC am besten neu.`);
    return { ursachen: top, warnungen, frage };
  }

  const DOKTOR = { ORTE, SYMPTOME, URSACHEN, FRAGEN, diagnose, bild };
  if (typeof module !== 'undefined') module.exports = DOKTOR; else root.HydroDoktor = DOKTOR;
})(this);

      <button class="karte-eintragen" data-act="eintragWahl" data-i="${i}">+ Eintragen</button>
      <button class="karte-topup" data-act="${lg && lg.knopf ? lg.knopf[0] : 'karteTopup'}" data-i="${i}">${lg && lg.knopf ? lg.knopf[1] : 'Nachfüllen'}</button></div>`; }).join('') +
      (versteckt ? `<p class="leise" style="font-size:15px">${versteckt === 1 ? 'Ein Tank ist' : versteckt + ' Tanks sind'} ausgeblendet. <button data-act="einstGruppe" data-g="tanks" style="text-decoration:underline;color:var(--leise);font-size:15px">In den Einstellungen einblenden</button></p>` : '') + nav();
  }

  // Phase, Sorte, Stärke und Blüte-Optionen eines Tanks. i steht an jedem Knopf, damit es überall funktioniert.
  function reglerHtml(e, i) {
    const mitI = h => h.replace(/data-act="setz"/g, `data-act="setz" data-i="${i}"`);
    return mitI(`<div class="gruppe"><div class="gruppe-titel">Phase</div>${segment('phase', PHASEN, e.phase)}</div>
        <div class="gruppe"><div class="gruppe-titel">Sorte</div>${segment('typ', TYPEN, e.typ)}</div>
        <div class="gruppe"><div class="gruppe-titel">Stärke</div>${segment('staerke', STAERKEN, e.staerke)}</div>
        ${e.phase === 'bluete' ? `<div class="gruppe"><div class="gruppe-titel">Blüte-Rezept</div>${segment('rezept', [['klassisch', 'Klassisch'], ['studie', 'Neu']], e.rezept === 'studie' ? 'studie' : 'klassisch')}</div>
          <p class="leise" style="font-size:15px;margin-top:-8px">${e.rezept === 'studie'
            ? 'Mehr Stickstoff, weniger Kalium. Kann mehr Ertrag bringen.'
            : 'Viel Kalium, so wie bisher.'}</p>` : ''}`)
      + (sparPhase(e.phase) ? `<button class="schalter" role="switch" aria-checked="${!!e.spar}" data-act="spar" data-i="${i}">
          <span>Sparmodus<small>${e.spar ? 'an, Ziel-EC ' + fmt(zielEC(e), 2) : 'aus'}</small></span><span class="pille"></span></button>
          <p class="leise" style="font-size:15px">Spart ein Drittel Dünger. Die Blüten werden etwas leichter, sind aber fast genauso stark. Geht am besten mit Rezept „Neu“. Erst an einem Tank ausprobieren.</p>` : '')
      + (e.phase === 'reife' ? `<button class="schalter" role="switch" aria-checked="${!!e.spuelen}" data-act="spuelen" data-i="${i}">
          <span>Spülen<small>${e.spuelen ? 'an: nur Wasser und Säure' : 'aus'}</small></span><span class="pille"></span></button>
          <p class="leise" style="font-size:15px">Nur Wasser, kein Dünger, kein Wasserglas. Höchstens eine Woche vor der Ernte.</p>` : '')
      + wasserWahlHtml(e.wasser, 'tank', i);
  }

  // Wasser auswählen: für alle Tanks (std), für einen Tank (tank) oder nur für diese Rechnung (einmal)
  function wasserWahlHtml(w, ziel, i) {
    const q = quellenListe(), attr = teil => `data-act="wWahl" data-ziel="${ziel}" data-teil="${teil}"${i != null ? ` data-i="${i}"` : ''}`;
    const seg = (teil, liste, wert) => `<div class="segment" role="group">${liste.map(([id, l]) => `<button ${attr(teil)} data-wert="${id}" aria-pressed="${String(wert) === String(id)}">${esc(l)}</button>`).join('')}</div>`;
    let h = '';
    if (ziel === 'tank') {
      h += `<div class="gruppe"><div class="gruppe-titel">Wasser für diesen Tank</div>${seg('modus', [['std', 'Wie alle Tanks'], ['eigen', 'Eigenes Wasser']], w ? 'eigen' : 'std')}</div>`;
      if (!w) return h + `<p class="leise zahl" style="font-size:15px;margin-top:-8px">${esc(wahlText(Z.einst.wasserWahl))}</p>`;
    }
    const ww = wahlSauber(w);
    if (q.length === 1) return h + `<p class="leise" style="font-size:15px">Bisher gibt es nur Leitungswasser. Weitere Wasserquellen wie Osmose- oder Regenwasser legst du unter Einstellungen → Wasser &amp; Säure an.</p>`;
    h += `<div class="gruppe"><div class="gruppe-titel">${ww.b ? 'Erstes Wasser' : 'Wasser'}</div>${seg('a', q, ww.a)}</div>`;
    h += `<button class="schalter" role="switch" aria-checked="${!!ww.b}" ${attr('misch')}><span>Zwei Wasser mischen<small>${ww.b ? esc(wahlText(ww)) : 'aus'}</small></span><span class="pille"></span></button>`;
    if (ww.b) h += `<div class="gruppe" style="margin-top:12px"><div class="gruppe-titel">Dazu gemischt</div>${seg('b', q.filter(x => x[0] !== ww.a), ww.b)}</div>
      <div class="gruppe"><div class="gruppe-titel">Anteil ${esc(quelleName(ww.b))}</div>${seg('anteil', [[25, '25 %'], [50, '50 %'], [75, '75 %']], ww.anteil)}</div>`;
    return h;
  }
  function wasserZeile(e) {
    const w = wasserWahlFuer(e);
    return `<button class="wert-zeile" data-act="wasserPanel" aria-expanded="${!!UI.wasserPanel}"><span>Wasser: ${esc(wahlText(w))}${UI.wasserEinmal ? ' (nur diesmal)' : ''}</span><span class="aendern-text">${UI.wasserPanel ? 'fertig' : 'ändern'}</span></button>
      ${UI.wasserPanel ? `<div class="wert-panel">${wasserWahlHtml(w, 'einmal')}<p class="leise" style="font-size:15px;margin:8px 0 0">Gilt nur für diese Rechnung. Der Tank behält seine Einstellung.</p></div>` : ''}`;
  }

  // Tankmaße direkt dort ändern, wo gerechnet wird
  function masseZeile(D) {
    const b = Z.einst.behaelter, L = K.liter(D.eimer, D.eimer.maxFuell);
    return `<button class="wert-zeile" data-act="masse" aria-expanded="${!!UI.masse}"><span class="zahl">Tank: bis ${fmt(D.eimer.maxFuell, 1)} cm, ${fmt(L, 1)} L${b.modus === 'netztopf' ? `, Netztopf ${fmt(b.netztopf, 1)} cm` : ''}</span><span class="aendern-text">${UI.masse ? 'fertig' : 'ändern'}</span></button>
      ${UI.masse ? `<div class="wert-panel">${behaelterFelder(b)}<p class="leise zahl" style="font-size:16px;margin:0">${behaelterText(D)}</p>
        <p class="leise" style="font-size:15px;margin:8px 0 0">Gilt für alle Tanks, sofort. Du bleibst auf dieser Seite.</p></div>` : ''}`;
  }

  function vEimer() {
    const e = Z.eimer[UI.eimer];
    const eintraege = Z.log.filter(x => x.eimer === UI.eimer && imAnbau(x, UI.eimer)).slice(-3).reverse();
    const titel = UI.namenEdit

         <div class="namen-form"><input type="text" id="eimerName" maxlength="24" value="${esc(e.name)}" aria-label="Name des Tanks"><button data-act="namenSpeichern">OK</button></div>
         ${fehlerText()}`
      : `<div class="kopf"><button class="zurueck" data-act="zurueck" aria-label="Zurück">‹</button><h1>${esc(e.name)}</h1><button class="stift" data-act="namenEdit" aria-label="Namen ändern">✎</button></div>`;
    return titel + `

      <div class="ziel"><div class="ec-gross zahl">${fmt(zielEC(e), 2)}</div><div class="leise">Ziel-EC für diesen Tank, inklusive Leitungswasser ${frage('ziel')}</div></div>
      ${lage(UI.eimer) ? `<div class="kalender" style="padding-top:12px">${lageHtml(lage(UI.eimer))}${lage(UI.eimer).diff ? `<p class="klein" style="margin:8px 0 0">Was heißt das? ${frage('seit')}</p>` : ''}</div>` : ''}
      ${vKontrolle(UI.eimer)}

      <button class="zeile-knopf doktor" data-act="doktor">Pflanzendoktor: Blätter sehen komisch aus?</button>

      ${(e.anbauten || []).length ? `<button class="zeile-knopf doktor" data-act="archiv" style="margin-top:14px">Frühere Anbauten (${e.anbauten.length})</button>` : ''}
      <button class="zeile-knopf leise-knopf" data-act="gehe" data-v="anbauEnde" style="margin-top:${(e.anbauten || []).length ? 0 : 14}px">Anbau beenden oder Tank entfernen</button>
      ${UI.kalEdit ? '' : `<div class="knoepfe"><div class="knoepfe-innen">
        <button class="gross ruhig" data-act="gehe" data-v="neu">Neu ansetzen</button>
        <button class="gross haupt" data-act="gehe" data-v="topup">Nachfüllen</button>
      </div></div>`}`;
  }

  function vNeu() {
    const e = Z.eimer[UI.eimer], D = daten(e);
    return kopf('Neu ansetzen') + `
      <p class="leise">${esc(e.name)}: ${esc(reglerText(e)).replace(/ · /g, ', ')}, Ziel-EC ${fmt(zielEC(e), 2)}</p>

      ${fehlerText()}
      <div class="knoepfe"><div class="knoepfe-innen"><button class="gross haupt" data-act="rechneNeu" ${UI.rechnet ? 'disabled' : ''}>${UI.rechnet ? 'Rechnet …' : 'Mischanleitung zeigen'}</button></div></div>`;
  }

  function vTopup() {
    const e = Z.eimer[UI.eimer], D = daten(e);
    const info = UI.info ? `<div class="hinweise"><p>${esc(de(UI.info))}</p></div>` : '';
    const l = letzter(UI.eimer);
    return kopf('Nachfüllen') + `
      <p class="leise">${esc(e.name)}: Ziel ${fmt(D.eimer.zielFuell, 0)} cm, Ziel-EC ${fmt(zielEC(e), 2)}</p>
      <div class="feld-zeile">
        <label class="feld"><span>Füllhöhe jetzt (cm)</span><input type="text" inputmode="decimal" id="hj" placeholder="z. B. 25" value="${esc(UI.eingabe.hj || '')}"></label>
        <label class="feld"><span>EC jetzt</span><input type="text" inputmode="decimal" id="ecj" placeholder="${l ? 'zuletzt ' + fmt(l.ec, 2) : 'z. B. 1,40'}" value="${esc(UI.eingabe.ecj || '')}"></label>
      </div>
      <details class="hilfe" style="margin-bottom:14px"><summary>Auf eine andere Höhe auffüllen</summary><div class="inhalt">
        <label class="feld"><span>Ziel-Füllhöhe in cm (normal ${fmt(D.eimer.maxFuell, 1)})</span>
          <input type="text" inputmode="decimal" id="hziel" value="${esc(UI.eingabe.hziel || '')}" placeholder="${fmt(D.eimer.maxFuell, 1)}"></label>
        <p class="leise" style="font-size:15px;margin:0">In der Anzucht kann es sinnvoll sein, höher zu füllen, damit das Wasser den Netztopf berührt.</p>
      </div></details>
      ${UI.vonMessung && UI.eingabe.hj ? `<p class="leise zahl" style="font-size:16px;margin-top:-6px">Aus deiner Messung von ${zeit(UI.vonMessung)} übernommen. Stimmt noch? Dann einfach auf Berechnen.</p>`
        : l ? `<p class="leise zahl" style="font-size:16px;margin-top:-6px">Zuletzt am ${datum(l.datum)}: ${l.h != null ? fmt(l.h, 1) + ' cm, ' : ''}EC ${fmt(l.ec, 2)}. Bitte jetzt neu ablesen und messen, die App entscheidet danach.</p>` : ''}
      ${masseZeile(D)}
      ${quellenListe().length > 1 ? wasserZeile(e) : ''}
      ${fehlerText()}${info}
      <p class="leise">Die App entscheidet anhand der EC, ob nur Wasser oder Nährlösung nachkommt. ${frage('nachfuellen')}</p>
      <div class="knoepfe"><div class="knoepfe-innen"><button class="gross haupt" data-act="rechneTopup" ${UI.rechnet ? 'disabled' : ''}>${UI.rechnet ? 'Rechnet …' : 'Berechnen'}</button></div></div>`;
  }

  // Nährstoffe im Tank mit gutem Bereich (so wie der Rechenkern prüft: bis 15 % drunter, bis 30 % drüber)
  function naehrBalken(a) {
    const zeilen = ['N', 'P', 'K', 'Ca', 'Mg'].map(x => {
      const ist = a.werte[x], soll = a.werteSoll[x], lo = soll * 0.85, hi = soll * 1.3;
      const max = Math.max(soll * 1.6, ist * 1.1), pz = v => Math.max(0, Math.min(100, v / max * 100));
      const lage = ist < lo ? 'etwas wenig' : ist > hi ? 'etwas viel' : 'gut';
      const wa = a.wasserWerte && a.wasserWerte[x] >= 1 && a.wasserWerte[x] >= ist * 0.1 ? `davon ${fmt(a.wasserWerte[x], 0)} aus dem Wasser` : lage;
      return `<div class="naehr-zeile"><span class="el">${x}</span>
        <div class="balken2" role="img" aria-label="${x}: ${fmt(ist, 0)} mg/L, guter Bereich ${fmt(lo, 0)} bis ${fmt(hi, 0)}, ${lage}"><span class="band" style="left:${pz(lo)}%;width:${pz(hi) - pz(lo)}%"></span><span class="punkt${lage === 'gut' ? '' : ' daneben'}" style="left:${pz(ist)}%"></span></div>
        <span class="wert zahl">${fmt(ist, 0)}<small>${esc(wa)}</small></span></div>`;
    }).join('');
    return `<div class="naehr"><div class="klein leise" style="font-size:15px;margin-bottom:4px">Nährstoffe im Tank, in mg/L</div>${zeilen}
      <p class="fuss">Grün ist der gute Bereich für diese Phase. Gelb heißt: etwas daneben, meist kein Problem.</p></div>`;
  }
  function dazuKarte(a) {
    if (a.dazu) return `<div class="naehr"><div class="klein leise" style="font-size:15px">Im ganzen Tank kommt dazu, in mg/L ${frage('dazu')}</div>
      <div class="dazu zahl">${['N', 'P', 'K', 'Ca', 'Mg'].map(x => `<div><small>${x}</small><b>+${fmt(Math.max(0, a.dazu[x]), 0)}</b></div>`).join('')}</div>
      <p class="fuss">So viel kommt dazu. Wie viel insgesamt drin ist, zeigt dir dein EC-Wert.</p></div>`;
    if (a.art === 'TOP-UP Wasser') return `<div class="naehr"><p class="fuss" style="font-size:16px;margin:4px 0 8px">Nur Wasser, kein Dünger. Das verdünnt den Tank etwas, die EC sinkt auf etwa ${fmt(a.ecErwartet, 2)}.</p></div>`;
    return '';
  }
  function vAnleitung() {
    const a = UI.anl, fertig = UI.haken.size === a.schritte.length;
    return kopf(a.titel) + `
      <p>${esc(de(a.text))}</p>
      ${a.wasser && a.wasser !== 'Leitungswasser' ? `<p class="leise" style="font-size:16px;margin-top:-6px">Gerechnet mit: ${esc(a.wasser)}</p>` : ''}
      <div class="zusammen zahl">
        <div><b>${fmt(a.liter, 1)} L</b>${a.art === 'Neuansatz' || a.art === 'Spülen' ? 'im Tank' : 'nachfüllen'}</div>
        ${a.ecVorSaeure != null ? `<div><b>${fmt(a.ecVorSaeure, 2)}</b>EC beim Messen</div>` : ''}
        <div><b>${fmt(a.ecErwartet, 2)}</b>EC am Ende</div>
      </div>
      ${a.werte && a.werteSoll ? naehrBalken(a) : a.werte ? `<div class="zusammen zahl">${['N', 'P', 'K', 'Ca', 'Mg'].map(x => `<div><b>${fmt(a.werte[x], 0)}</b>${x}</div>`).join('')}</div>` : ''}
      ${dazuKarte(a)}
      ${a.ecVorSaeure != null ? `<p class="leise zahl" style="font-size:16px">An der Messstelle sind Wasser, die erste Säure und alle Salze drin, das ergibt etwa ${fmt(a.ecVorSaeure, 2)}. Die restliche Säure hebt die EC noch um rund ${fmt(a.ecErwartet - a.ecVorSaeure, 2)}, am Ende liegst du beim Ziel von ${fmt(a.ecZiel, 2)}. Das ist kein Fehler.</p>` : ''}
      ${hinweisBox(a.hinweise)}
      <h2>Schritte</h2>
      <p class="leise">Tippe einen Schritt an, wenn er erledigt ist.</p>
      <ol class="schritte">${a.schritte.map((s, i) => `<li><button class="schritt" data-act="haken" data-i="${i}" aria-pressed="${UI.haken.has(i)}">
        <span class="nr">${UI.haken.has(i) ? '✓' : i + 1}</span><span><span class="menge zahl">${esc(s.menge)}</span><span class="was">${esc(s.was)}</span></span></button></li>`).join('')}</ol>
      <h2>Gemessene Werte</h2>
      <p class="leise">${fertig ? 'Alles erledigt. Trag ein, was du am Ende gemessen hast.' : 'Wenn du fertig bist, trag hier ein, was du gemessen hast.'}</p>
      <div class="feld-zeile2">
        <label class="feld"><span>EC</span><input type="text" inputmode="decimal" id="ec" value="${esc(UI.eingabe.ec || '')}"></label>
        <label class="feld"><span>pH</span><input type="text" inputmode="decimal" id="ph" value="${esc(UI.eingabe.ph || '')}"></label>
      </div>
      <label class="feld"><span>Säure verbraucht in ml (optional)</span><input type="text" inputmode="decimal" id="sml" value="${esc(UI.eingabe.sml || '')}"></label>
      <label class="feld"><span>Notiz (optional)</span><input type="text" id="notiz" style="font-size:18px" value="${esc(UI.eingabe.notiz || '')}"></label>
      ${fehlerText()}
      <div class="knoepfe"><div class="knoepfe-innen"><button class="gross haupt" data-act="eintragen">Eintrag speichern</button></div></div>`;
  }

  // ---------- Fotos (IndexedDB, bleiben auf dem Gerät) ----------
  let FOTOS = [], fotoFehler = false;
  const urls = new Map();
  function fotoUrl(f) { if (!urls.has(f.id)) urls.set(f.id, URL.createObjectURL(f.blob)); return urls.get(f.id); }
  function dbOpen() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('hydro-fotos', 1);
      r.onupgradeneeded = () => { const db = r.result; if (!db.objectStoreNames.contains('fotos')) db.createObjectStore('fotos', { keyPath: 'id' }); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  }
  function dbTun(modus, fn) {
    return dbOpen().then(db => new Promise((res, rej) => {
      const tx = db.transaction('fotos', modus), st = tx.objectStore('fotos');
      const anfrage = fn(st);
      tx.oncomplete = () => res(anfrage && anfrage.result); tx.onerror = () => rej(tx.error);
    }));
  }
  async function fotosLaden() {
    try { FOTOS = (await dbTun('readonly', st => st.getAll())) || []; FOTOS.sort((a, b) => a.datum < b.datum ? 1 : -1); }
    catch (e) { fotoFehler = true; }
  }
  async function verkleinern(datei) {
    let bmp;
    try { bmp = await createImageBitmap(datei, { imageOrientation: 'from-image' }); } catch (e) { bmp = await createImageBitmap(datei); }
    const s = Math.min(1, 1400 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    bmp.close && bmp.close();
    return new Promise(r => c.toBlob(r, 'image/jpeg', 0.72));
  }
  const fotosVon = i => FOTOS.filter(f => f.eimer === i && imAnbau(f, i));
  function fotoUnterschrift(f) {
    const e = Z.eimer[f.eimer], k = e && e.bluete ? kalender(e) : null;
    const d = new Date(f.datum);
    const fotoTag = Date.UTC(d.getFullYear(), d.getMonth(), d.getDate());
    const tage = k ? Math.floor((fotoTag - ausISO(e.bluete.start)) / TAG) + 1 : null;
    return datum(f.datum) + (tage && tage >= 1 ? `, ${k.auto ? 'Tag' : 'Blütetag'} ${tage}` : '');
  }

  // ---------- Blütekalender ----------
  const TAG = 864e5;
  const heuteUTC = () => { const d = new Date(); return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()); };
  const heuteISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const ausISO = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
  const tagDatum = t => new Date(t).toLocaleDateString('de-DE', { day: 'numeric', month: 'numeric', year: 'numeric', timeZone: 'UTC' });
  const tagDatumKurz = t => new Date(t).toLocaleDateString('de-DE', { day: 'numeric', month: 'numeric', timeZone: 'UTC' });
  function parseDauer(t) {
    const m = String(t || '').trim().match(/^(\d{2,3})(?:\s*(?:-|–|bis)\s*(\d{2,3}))?$/);
    if (!m) return null;
    const von = +m[1], bis = m[2] ? +m[2] : von;
    if (von < 20 || bis > 200 || bis < von) return null;
    return { von, bis };
  }
  function kalender(e) {
    const b = e.bluete; if (!b || !b.start || !b.von) return null;
    const start = ausISO(b.start), heute = heuteUTC();
    const tag = Math.floor((heute - start) / TAG) + 1; // Starttag = Tag 1
    // Starttag zählt als Tag 1, also ist Tag N der Tag start + (N-1)
    const ernteVon = start + (b.von - 1) * TAG, ernteBis = start + (b.bis - 1) * TAG;
    const rest = Math.round((ernteVon - heute) / TAG), restBis = Math.round((ernteBis - heute) / TAG);
    const mitte = (b.von + b.bis) / 2;
    return { tag, woche: Math.ceil(tag / 7), ernteVon, ernteBis, rest, restBis, anteil: Math.max(0, Math.min(1, (tag - 1) / mitte)), auto: e.typ === 'auto', spanne: b.von !== b.bis };
  }
  // Photos vor der Blüte: Tag seit Keimung, und ob die Blütedauer schon bekannt ist
  function vegi(e) {
    if (e.typ === 'auto' || (e.bluete && e.bluete.start)) return null;
