# Führt die Rechen-Tests bei jedem Pull Request und jedem Push auf main aus.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rezept
        run: node tests/rezept.test.js
      - name: Schwefelsäure
        run: node tests/schwefel.test.js
