# Führt die Rechen-Tests bei jedem Pull Request und jedem Push auf main aus.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Jede Datei tests/*.test.js läuft automatisch mit; alle laufen durch, auch wenn eine scheitert.
      - name: Node-Tests
        run: |
          fehler=0
          for f in tests/*.test.js; do
            echo "::group::$f"
            node "$f" || fehler=1
            echo "::endgroup::"
          done
          exit $fehler

  vergleich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scipy
      - name: App gegen unabhängige Optimierung
        run: python3 tests/vergleich_optimum.py
